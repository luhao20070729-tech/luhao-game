  if (S.wish.done) return;
  const w = WISH(S.wish.id);

}

/* ---------- 每年结算时跑一遍 ---------- */
function lifeTick(){
  const f = S.flags, st = S.st, a = S.age;
  const up = (k, n = 1) => { st[k] = clamp(st[k] + n, 0, 100); };
  // 天赋的日常影响
  if (tal('iron') && chance(.6)) up('health');
  if (tal('beauty') && a >= 30 && chance(.5)) up('looks');
  if (tal('long') && a >= 50) up('health');
  if (tal('harmony')) up('happy');
  if (tal('late') && a >= 50 && chance(.6)) up('smarts');
  if (tal('model') && S.job && a % 2 === 0) S.job.perf = (S.job.perf || 0) + 1;
  if (tal('noble') && !f.nobleUsed && a >= 22 && !S.jail){
    const owe = S.debts.reduce((s, d) => s + d.amt, 0);
    if (owe >= 100000 || S.money < -50000){
      f.nobleUsed = a;
      let left = 500000, paid = 0;
      [...S.debts].sort((x, y) => y.rate - x.rate).forEach(d => { const x = Math.min(d.amt, left); d.amt -= x; left -= x; paid += x; });
      S.debts = S.debts.filter(d => d.amt > 0);
      if (S.money < 0){ const x = Math.min(-S.money, 200000); S.money += x; paid += x; }
      L(`就在你快撑不下去的时候，一位多年前受过你家恩惠的长辈找上门来，二话不说替你填上了 ${fmt(paid)} 的窟窿：“谁都有难的时候，这钱不用还。”`, 'g', {happy:12, stress:-15}, true);
      node('贵', '贵人相助', '走投无路的时候，有人拉了你一把。');
    }
  }
  eraTick();
  // 断缴的保险会失效
  if (f.ins && (S.money < -20000 || f.homeless || S.jail)){
    f.ins = 0;
    L('你已经交不起保费了，保险公司寄来一封信：保单失效。', 'b', {stress:3});
  }
  if ((S.hab || {})['约老同学'] > 0){ f.reun = (f.reun || 0) + 1; if (f.reun >= 3) unlock('reunion'); }
  wishTick();
  oldTick();
}

   每个年纪都有几件“做了真的有用”的事；老了也能创业；公司能折腾；
   天上掉的馅饼有真有假
   ========================================================================== */
function lastKind(){ const g = S.log[S.log.length - 1], it = g && g.items[g.items.length - 1]; return it ? it.k : 'n'; }
/* 在刚写下的那句话后面补一句“这件事带来了什么” */
function noteLast(s){ const g = S.log[S.log.length - 1], it = g && g.items[g.items.length - 1]; if (it) it.t += s; }
function bump(k, n, max){ S.flags[k] = Math.round(Math.min(max, (S.flags[k] || 0) + n) * 10) / 10; return S.flags[k]; }
const actBy = l => ACTS.find(a => a.l === l);
const grownKids = (lo = 22) => S.kids.filter(k => !k.dead && S.age - k.b >= lo);
function kidLove(k, n){ k.bond = (k.bond || 0) + n; if (S.age - k.b >= 25 && k.bond >= 3) k.filial = true; }

/* ---------- 晚年的身体底子：常锻炼、常动脑、有老伙伴，就没那么容易倒下 ---------- */
function oldCare(){
  const f = S.flags, a = S.age;
  if (a < 50) return 1;
  let m = 1 - Math.min(.3, (f.fit || 0) * .03);
  if (f.checkY >= a - 2) m *= .88;
  if ((f.oldfr || 0) >= 3) m *= .93;
  return m;
}

/* ---------- 每年结算时的额外收入：手艺、私活、养老账户、书法字画、菜地、公司分红 ---------- */
function sideIncome(notes){
  const f = S.flags, a = S.age;
  let v = 0;
  const add = (x, t) => { if (x > 0){ v += x; notes.push(`${t} ${fmt(x)}`); } };
  if ((f.craft || 0) >= 3 && a >= 18 && !S.jail && (!S.job || a >= 60)) add(Math.round(R(8, 20) * 1000 * f.craft / 3), `${f.craftN || '手艺'}活`);
  if ((f.coder || 0) >= 3 && a >= 18 && a < 65 && !S.jail && !S.job && S.st.smarts >= 50) add(R(3, 8) * 10000, '接私活');
  if (f.nest > 0){
    if (a < 60) f.nest = Math.round(f.nest * 1.04);
    else { const x = Math.round(f.nest / Math.max(4, 85 - a)); f.nest -= x; if (f.nest < 1000) f.nest = 0; add(x, '养老账户'); }
  }
  if (f.callig && a >= 60 && chance(.6)) add(R(2, 15) * 1000, '书法润笔');
  if ((f.garden || 0) >= 1 && f.gardenY >= a - 2) add(R(3, 8) * 1000, '菜地省下的菜钱');
  if (f.bizDiv > 0) add(Math.round(f.bizDiv * (.7 + Math.random() * .6)), '孩子公司给的分红');
  if (f.consult === a - 1) add(f.consultPay, '顾问费');
  return v;
}

/* ---------- 每年跑一遍：不练就会退步 ---------- */
function oldTick(){
  const f = S.flags, a = S.age;
  if (f.fit && f.fitY < a - 1) f.fit = Math.max(0, f.fit - 1);
  if (f.brain && f.brainY < a - 1) f.brain = Math.max(0, f.brain - 1);
  if (f.oldfr && f.oldfrY < a - 3) f.oldfr = Math.max(0, f.oldfr - 1);
  if ((f.oldfr || 0) >= 3 && a >= 55) S.st.happy = clamp(S.st.happy + 1, 0, 100);
  if (f.bizDiv && !S.kids.some(k => !k.dead && k.biz)) f.bizDiv = 0;
}

function oppEvent(o){
  const real = chance(o.p), amt = o.amt ? o.amt() : 0, sharp = S.flags.antiScam ? .2 : 0;
  const caught = () => L((o.caught || pickFresh('opCaught', ['你多问了几句，对方就开始支支吾吾，再也没了下文。', '你上网一搜，同样的说辞早就被人曝光过。', '你去派出所问了问，民警说这是老套路了，让你千万别信。', '你按官方渠道一查，压根没这回事。', '你让对方拿出证明，对方立马不吭声了。', '你问了懂行的朋友，朋友说：“这是骗局，别碰。”', '你多等了一天，对方就急了，催得越来越凶——你更确定有问题了。', '你在社区的防骗讲座上听过一模一样的故事。'])) + (S.flags.antiScam ? '（老年大学的防骗课派上了用场）' : ''), 'g', {happy:3, stress:-2});
  const vfail = () => real ? L(o.slow || pickFresh('opSlow', ['你查了半天也没查明白，没敢碰。后来才知道那是真的，白白错过了。', '等你核实清楚，机会已经让别人拿走了。', '你犹豫得太久，对方说名额已经满了。后来证实那是真的。']), 'n', {happy:-3}) : L(pickFresh('opVF', ['你查了半天也没查明白，干脆没理。', '你问了一圈，众说纷纭，最后决定算了。', '你核实不了真假，索性当没这回事。']), 'n');
  modal(o.title, o.text(amt), [
    {l:o.go || '相信，照做', d:o.goD ? o.goD(amt) : '', f:() => real ? o.win(amt, false) : o.lose(amt)},
    {l:o.check || '先核实一下', f:() => chance(.65 + sharp) ? (real ? o.win(amt, true) : caught()) : vfail()},
    {l:o.no || '不理', f:() => real ? (o.miss ? o.miss(amt) : L(pickFresh('opMiss', ['后来你才知道，那居然是真的。你懊恼了好几天。', '过了一阵，你听说别人信了，真的拿到了好处。', '后来证实那件事是真的，你只能安慰自己“不是自己的财”。']), 'n', {happy:-4})) : L(o.dodge || pickFresh('opDodge', ['后来新闻里说，很多人在这上面吃了亏。你庆幸自己没理。', '你当时没理会。后来才知道，那是一个骗局。', '你没上当。过了没多久，那伙人就被警察端了。', '你后来在新闻里看到了一模一样的套路，倒吸一口凉气。']), 'g', {happy:2})},
  ], o.tag || '机会');
}

/* ---------- 人生总结图：一张可以保存、发给朋友比较的长图 ---------- */
/* 满分 1000：寿命 200 · 身心 200 · 财富 150 · 家庭 150 · 成就见识 200 · 品行 100，每一项越往上越难 */
const SCORE_PARTS = [['寿命', 200], ['身心', 200], ['财富', 150], ['家庭', 150], ['成就见识', 200], ['品行', 100]];
function scoreLife(){
  const f = S.flags, A = S.acc && S.acc.n ? S.acc : null, st = S.st;
  const life = 200 * Math.pow(Math.min(S.age, 100) / 100, 1.3);
  // 身心看的是一辈子的平均状态，不只是临死前那一刻
  const av = k => A[k] / A.n;
  const v = A ? av('h') * .25 + av('p') * .35 + av('s') * .2 + av('l') * .1 + (100 - av('t')) * .1
              : st.health * .25 + st.happy * .35 + st.smarts * .2 + st.looks * .1 + (100 - st.stress) * .1;
  const body = 200 * Math.pow(clamp(v, 0, 100) / 100, 1.5) * Math.min(1, (S.age + 20) / 70);   // 活得太短，身心分要打折
  const wealth = 150 * clamp((Math.log10(Math.max(worth(), 1)) - 4) / 5, 0, 1);
  const P = S.partner, kids = S.kids.filter(k => !k.dead);
  let fam = P && P.married ? 20 + Math.min(40, (S.age - P.since) * .8) : S.ach.includes('married') ? 15 : f.everLoved ? 5 : 0;
  fam += Math.min(3, kids.length) * 12 + (kids.some(k => k.filial) ? 14 : 0) + Math.min(40, (S.grand || 0) * 10);
  fam = Math.min(150, fam);
  const places = new Set(S.photos.map(p => p.p)).size;

}

function skyScene(){

const skyBg = (() => {
  const cv = $('#sky'), g = cv.getContext('2d');
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  const css = (c, al = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`;
  let W = 1, H = 1, cur = null, tgt = null, sun = null, sunT = {x:.12, y:.6}, scene = 'dawn', dark = false, running = false, last = 0, darkCheck = 0;
  const motes = Array.from({length:24}, () => ({x:Math.random(), y:Math.random(), r:.8 + Math.random() * 1.8, s:.006 + Math.random() * .012, ph:Math.random() * 6.3}));
  const stars = Array.from({length:110}, () => ({x:Math.random(), y:Math.random() * .62, r:Math.random() * 1.1 + .3, ph:Math.random() * 6.3}));
  const clouds = Array.from({length:5}, () => ({x:Math.random(), y:.06 + Math.random() * .3, w:.16 + Math.random() * .22, v:.003 + Math.random() * .005}));
  const drops = Array.from({length:70}, () => ({x:Math.random(), y:Math.random(), v:.5 + Math.random() * .5}));
  const ridges = [0, 1, 2].map(() => Array.from({length:3}, (_, i) => [Math.random() * 6.3, (1 + Math.random() * 2) * (i + 1)]));
  const ridgeY = (L, x) => {
    const base = [.64, .73, .84][L], amp = [.1, .075, .05][L];
    return base - amp * (ridges[L].reduce((s, [ph, f], i) => s + Math.sin(x * Math.PI * 2 * f + ph) * [.55, .3, .15][i], 0) * .5 + .5);
  };
  function resize(){
    const dpr = Math.min(1.5, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (cur) draw(performance.now());
  }
  function readDark(){ return getComputedStyle(document.documentElement).getPropertyValue('--sky-dark').trim() === '1'; }
  function set(sc, p){
    scene = sc; dark = readDark();
    tgt = SKY[dark ? 'dark' : 'light'][sc].map(hex);
    sunT = {x:.1 + .8 * p, y:.6 - .4 * Math.sin(Math.PI * p)};
    if (!cur || reduced){ cur = tgt.map(c => c.slice()); sun = {...sunT}; }
    if (reduced) draw(0);
    else if (!running){ running = true; requestAnimationFrame(loop); }
  }
  function loop(now){
    if (document.hidden){ running = false; return; }
    if (now - last > 33){
      const k = Math.min(1, (now - last) / 900);
      cur = cur.map((c, i) => mix(c, tgt[i], k));
      sun.x += (sunT.x - sun.x) * k; sun.y += (sunT.y - sun.y) * k;
      if (now - darkCheck > 1000){ darkCheck = now; if (readDark() !== dark) set(scene, (sunT.x - .1) / .8); }
      draw(now); last = now;
    }
    requestAnimationFrame(loop);
  }
  function draw(now){
    const t = now / 1000, c = cur, night = scene === 'night';
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, css(c[0])); gr.addColorStop(.55, css(c[1])); gr.addColorStop(1, css(c[2]));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    if (night || dark) stars.forEach(s => { g.fillStyle = `rgba(255,255,255,${(night ? .55 : .3) + Math.sin(t * 1.7 + s.ph) * .25})`; g.beginPath(); g.arc(s.x * W, s.y * H, s.r, 0, 6.3); g.fill(); });
    const sx = sun.x * W, sy = sun.y * H, R = Math.max(26, Math.min(W, H) * .06);
    const glow = g.createRadialGradient(sx, sy, 0, sx, sy, R * 5);
    glow.addColorStop(0, css(c[5], night ? .35 : .75)); glow.addColorStop(1, css(c[5], 0));
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    g.fillStyle = css(c[5], .95); g.beginPath(); g.arc(sx, sy, R * .62, 0, 6.3); g.fill();
    if (night){ g.fillStyle = css(c[0], .9); g.beginPath(); g.arc(sx + R * .25, sy - R * .12, R * .55, 0, 6.3); g.fill(); }
    if (!night) clouds.forEach(cl => {
      const x = ((cl.x + t * cl.v * .05) % 1.4 - .2) * W, y = cl.y * H, w = cl.w * W;
      const cg = g.createRadialGradient(x, y, 0, x, y, w);
      cg.addColorStop(0, `rgba(255,255,255,${dark ? .07 : .4})`); cg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = cg; g.beginPath(); g.ellipse(x, y, w, w * .28, 0, 0, 6.3); g.fill();
    });
    [0, 1, 2].forEach(L => {
      const col = L === 0 ? c[3] : L === 2 ? c[4] : mix(c[3], c[4], .5);
      g.fillStyle = css(col, [.6, .82, 1][L]);
      g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, ridgeY(L, x / Math.max(W, 600)) * H);
      g.lineTo(W, H); g.closePath(); g.fill();
      if (L < 2){
        const my = ridgeY(L, .5) * H, mg = g.createLinearGradient(0, my - 20, 0, H);
        mg.addColorStop(0, `rgba(255,255,255,0)`); mg.addColorStop(.35, `rgba(255,255,255,${dark ? .04 : .16})`); mg.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = mg; g.fillRect(0, my - 20, W, H);
      }
    });
    if (scene === 'rain'){
      g.strokeStyle = `rgba(255,255,255,${dark ? .18 : .45})`; g.lineWidth = 1;
      g.beginPath();
      drops.forEach(d => { const y = ((d.y + t * d.v) % 1) * H, x = (d.x * W + y * .15) % W; g.moveTo(x, y); g.lineTo(x - 3, y + 14); });
      g.stroke();
    } else motes.forEach(m => {
      const y = (((m.y - t * m.s) % 1) + 1) % 1, x = m.x + Math.sin(t * .6 + m.ph) * .012;
      const al = (night ? .8 : .45) * (.5 + .5 * Math.sin(t * 2 + m.ph));
      g.fillStyle = night ? `rgba(214,240,150,${al})` : css(c[5], al);
      g.beginPath(); g.arc(x * W, y * H, m.r, 0, 6.3); g.fill();
    });
  }
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !running && !reduced && cur){ running = true; requestAnimationFrame(loop); } });
  resize();
  return {set};
})();

/* ---------- 成就解锁动画 ---------- */
const achQ = [];
let achBusy = false;
function achPop(a){ achQ.push(a); if (!achBusy) achNext(); }
function particles(th){
  let h = '';
  const n = th === 'zen' ? 0 : th === 'dark' ? 10 : 14;
  for (let i = 0; i < n; i++){
    const ang = (i / n) * Math.PI * 2 + Math.random() * .4, d = 42 + Math.random() * 46;
    let x = Math.cos(ang) * d, y = Math.sin(ang) * d * .75, cls = 'pt', inner = '', st = '';
    if (th === 'money'){ cls += ' coin'; x = (Math.random() - .5) * 150; y = 40 + Math.random() * 70; }
    else if (th === 'love'){ cls += ' glyph'; inner = '♥'; y -= 18; }
    else if (th === 'study'){ cls += ' glyph'; inner = '✦'; }
    else if (th === 'star'){ cls += ' glyph'; inner = '★'; st = `color:${pick(['#F2B84B','#E76F9A','#7CA8F2','#9B6BE0'])};`; }
    else if (th === 'travel'){ cls += ' streak'; x = 70 + Math.random() * 110; y = (Math.random() - .5) * 46; }
    else if (th === 'life'){ cls += ' leaf'; y = -24 - Math.random() * 46; }
    else if (th === 'dark'){ cls += ' ash'; x = (Math.random() - .5) * 90; y = 26 + Math.random() * 50; }
    else if (th === 'shake') cls += ' chip';
    else cls += ' spark';
    h += `<i class="${cls}" style="--x:${x | 0}px;--y:${y | 0}px;--r:${R(-200, 200)}deg;--dl:${(Math.random() * .15).toFixed(2)}s;${st}">${inner}</i>`;
  }
  for (let i = 0; i < (th === 'zen' ? 3 : 1); i++) h += `<i class="ring" style="--dl:${(i * .45).toFixed(2)}s"></i>`;
  return h;
}
function achNext(){
  const a = achQ.shift();
  if (!a){ achBusy = false; return; }
  achBusy = true;
  const [id, n, seal, th] = a;
  bgm.event('ach');
  cue(ACHFX[id]);
  const el = document.createElement('div');
  el.className = 'ach t-' + th;
  el.innerHTML = `<div class="medal">${esc(seal)}</div><div class="burst">${particles(th)}</div><div class="txt"><small>成就解锁</small><b>${esc(n)}</b></div>`;
  $('#achs').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 600); }, 2800);
  setTimeout(achNext, 1500);
}

function animateNumber(el, from, to, f){
  const token = el._anim = (el._anim || 0) + 1;   // 新的更新会作废还没播完的旧动画，免得旧数字盖住新数字
  if (reduced || from === to || document.hidden){ el.textContent = f(to); return; }
  const t0 = performance.now(), dur = 650;
  setTimeout(() => { if (el._anim === token){ el.textContent = f(to); el.classList.remove('flash-up', 'flash-dn'); } }, dur + 300);   // 画面在后台时动画帧会暂停，保证最后显示的一定是正确的数字
  el.classList.remove('flash-up', 'flash-dn'); el.classList.add(to > from ? 'flash-up' : 'flash-dn');
  const step = now => {
    if (el._anim !== token) return;
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = f(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step); else setTimeout(() => el.classList.remove('flash-up', 'flash-dn'), 400);
  };
  requestAnimationFrame(step);
}

    ${S.tal && TAL(S.tal) ? `<dt>天赋</dt><dd>${TAL(S.tal).n} · ${TAL(S.tal).d}</dd>` : ''}
    ${S.wish && WISH(S.wish.id) ? `<dt>心愿</dt><dd>${WISH(S.wish.id).n}（${WISH(S.wish.id).d}）${S.wish.done ? ` · ${S.wish.done} 岁时达成` : ' · 还没实现'}</dd>` : ''}
    ${S.era && ERA(S.era.id) ? `<dt>时代</dt><dd>${ERA(S.era.id).n} · 还会持续 ${Math.max(1, S.era.to - S.age)} 年左右</dd>` : ''}
    ${S.flags.ins ? `<dt>保险</dt><dd>每年保费 ${fmt(insFee())} · 大病和意外报销六成</dd>` : ''}
    ${(S.anc || []).length ? `<dt>家族</dt><dd>第 ${S.gen} 代 · 祖辈：${S.anc.map(x => `${esc(x.n)}(${x.a}岁 · ${x.s}分)`).join(' → ')}</dd>` : ''}
    ${extra.length ? `<dt>其他</dt><dd>${extra.join(' · ')}</dd>` : ''}`;
}
function chipsHTML(){
  const f = S.flags, chips = [`<span class="chip trait" title="${esc(trait().d)}">性格：${trait().n}</span>`];
  if (S.tal && TAL(S.tal)) chips.push(`<span class="chip trait" title="${esc(TAL(S.tal).d)}">天赋：${TAL(S.tal).n}</span>`);
  if (S.gen > 1) chips.push(`<span class="chip">第 ${S.gen} 代</span>`);
  if (S.wish && WISH(S.wish.id)) chips.push(`<span class="chip${S.wish.done ? ' trait' : ''}" title="${esc(WISH(S.wish.id).d)}">心愿：${WISH(S.wish.id).n}${S.wish.done ? ' ✓' : ''}</span>`);
  if (S.era && ERA(S.era.id)) chips.push(`<span class="chip state">${ERA(S.era.id).n}</span>`);
  if (f.ins) chips.push('<span class="chip">有保险</span>');
  if (S.jail) chips.push(`<span class="chip state">还要坐 ${S.jail} 年牢</span>`);
  if (f.homeless) chips.push('<span class="chip state">无家可归</span>');
  S.ills.forEach(il => chips.push(`<span class="chip ill">${ILL[il.id].n}${il.yrs ? ` · ${il.yrs}年` : ''}</span>`));
  if (f.smoker) chips.push('<span class="chip vice">烟瘾</span>');
  if (f.drunkard) chips.push('<span class="chip vice">酗酒</span>');
  if (f.gambler) chips.push('<span class="chip vice">赌瘾</span>');
  if (S.affair) chips.push(`<span class="chip vice">情人：${esc(S.affair.n)}</span>`);
  if (S.owed > 0) chips.push(`<span class="chip">被欠薪 ${fmt(S.owed)}</span>`);
  if (debtTotal()) chips.push(`<span class="chip vice">欠债 ${fmt(debtTotal())}</span>`);
  if (S.loans.length) chips.push(`<span class="chip">借出 ${fmt(S.loans.reduce((s, l) => s + l.amt, 0))}</span>`);
  return chips.join('');
}
function render(){
  const f = S.flags;
  document.body.classList.remove('scroll');
  $('#tools').hidden = false;
  $('#who').textContent = `${S.name} · ${S.gender === 'm' ? '男' : '女'} · ${FAM.find(x => x.id === S.origin).n}${f.adopted ? '，后被收养' : ''}`;
  const ageEl = $('#age');
  ageEl.textContent = S.age;
  if (prev && prev.age !== S.age){ ageEl.classList.remove('tick'); void ageEl.offsetWidth; ageEl.classList.add('tick'); }
  if (prev && S.alive && prev.age !== S.age && stage(prev.age) !== stage(S.age)) stageCard(stage(S.age));
  $('#stage').textContent = !S.alive ? '已故' : S.jail ? '服刑中' : f.homeless ? '流浪中' : f.monk ? '出家' : stage(S.age);
  const [sc, p] = skyScene(); skyBg.set(sc, p); bgm.scene(sc);

  const money = $('#money');
  money.classList.toggle('neg', S.money < 0);
  animateNumber(money, prev ? prev.money : S.money, S.money, v => fmt(Math.round(v)));
  $('#worth').textContent = assetValue() || debtTotal() ? `身家 ${fmt(Math.round(worth()))}` : '';
  $('#brief').innerHTML = `<span><b>${esc(workText())}</b></span><span>${esc(loveText())}</span><span>${eduText()}</span>`;
  $('#chips').innerHTML = chipsHTML();

  const stats = $('#stats');
  if (!stats.children.length){
    stats.innerHTML = STATS.map(([k, n, c]) => `<div class="stat${k === 'stress' ? ' inv' : ''}" data-k="${k}"><span class="k">${n}</span><div class="bar"><i style="width:0;background-color:var(${c})"></i></div><span class="v">0</span></div>`).join('');
  }
  STATS.forEach(([k]) => {
    const row = stats.querySelector(`[data-k="${k}"]`);
    row.querySelector('i').style.width = S.st[k] + '%';
    row.querySelector('.v').textContent = S.st[k];
    row.classList.toggle('hot', S.alive && (k === 'stress' ? S.st[k] >= 75 : k === 'health' && S.st[k] <= 20));
    const d = prev ? S.st[k] - prev.st[k] : 0;
    if (d){
      const el = document.createElement('span');
      el.className = 'float ' + (d > 0 ? 'up' : 'dn'); el.textContent = (d > 0 ? '+' : '') + d;
      row.appendChild(el); setTimeout(() => el.remove(), 1400);
    }
  });
  $('#info').innerHTML = infoHTML();

  $('#actsCard').hidden = !S.alive;
  $('#ending').hidden = S.alive;
  $('#albumBtn').textContent = `相册 ${S.photos.length}`; $('#albumBtn').disabled = !S.photos.length;
  const ng = S.assets.houses.length + S.assets.cars.length + (S.items || []).length + (S.pets || []).length + (S.petMem || []).length;
  $('#goodsBtn').textContent = `物品 ${ng}`; $('#goodsBtn').disabled = !ng;
  if (S.alive) renderActs();
  else {
    const end = ENDINGS.find(e => e.id === S.end) || ENDINGS[ENDINGS.length - 1];
    $('#ending').innerHTML = `
      <div class="tag">${esc(S.name)} · 享年 ${S.age} 岁 · 人生评分 ${S.score} / 1000</div>
      <div style="margin:6px 0">${gradeHTML(S.score)}</div>
      <div class="title">${esc(end.n)}</div>
      <div>${esc(end.e)}</div>
      <div class="row"><button class="btn primary" id="again">再活一次</button>${heirList().length ? '<button class="btn" id="heirBtn">传给下一代</button>' : ''}<button class="btn" id="cardBtn">人生总结图</button><button class="btn" id="replay">重看谢幕</button></div>`;
    $('#again').onclick = () => { clearSave(); showStart(); };
    if ($('#heirBtn')) $('#heirBtn').onclick = heirMenu;
    $('#replay').onclick = showFinale;
    $('#cardBtn').onclick = showShareCard;
    recordScore();
    if (S.showFinale){ S.showFinale = false; save(); const me = S; setTimeout(() => { if (S === me) showFinale(); }, reduced ? 0 : 900); }
  }
  renderLog();
  prev = {age:S.age, st:{...S.st}, money:S.money};
}
function renderLog(){
  const log = $('#log');
  if (!S._id) S._id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fresh = log.dataset.life !== S._id;
  if (fresh){ log.innerHTML = ''; log.dataset.life = S._id; logNodes = new Map(); }
  let added = false;
  S.log.forEach(g => {
    let n = logNodes.get(g.age);
    if (!n){
      const el = document.createElement('div');
      el.className = 'year' + (fresh ? '' : ' enter');
      el.innerHTML = `<div class="y">${g.age}岁<small>${stage(g.age)}</small></div><div class="items"></div>`;
      log.prepend(el); n = {el, c:0}; logNodes.set(g.age, n); added = true;
    }
    if (n.c !== g.items.length){
      const box = n.el.querySelector('.items');
      g.items.slice(n.c).forEach((it, i) => {
        const d = document.createElement('div');
        d.className = `item ${it.k}` + (fresh ? '' : ' new');
        d.style.setProperty('--i', i);
        d.innerHTML = `${esc(it.t)}${it.fx.length ? `<span class="fx">${it.fx.map(([k, v]) => `<em class="${v > 0 ? 'up' : 'dn'}${k === 'stress' ? ' inv' : ''}">${NAMES[k]} ${v > 0 ? '+' : ''}${k === 'money' ? fmt(v) : v}</em>`).join('')}</span>` : ''}`;
        box.appendChild(d);
      });
      n.c = g.items.length;
    }
  });
  log.querySelectorAll('.year.now').forEach(e => e.classList.remove('now'));
  log.firstElementChild && log.firstElementChild.classList.add('now');
  if (added) log.scrollTop = 0;
}

/* ---------- finale ---------- */
function pickMilestones(){
  const all = S.ms.slice(1, -1), seen = new Set(), out = [];
  const add = m => { if (!seen.has(m.t) && out.length < 10){ seen.add(m.t); out.push(m); } };
  all.filter(m => m.big).forEach(add);
  const rest = all.filter(m => !m.big);
  for (let i = 0; i < rest.length && out.length < 10; i += Math.max(1, Math.floor(rest.length / 6))) add(rest[i]);
  return out.sort((a, b) => a.a - b.a);
}
function showFinale(){
  const end = ENDINGS.find(e => e.id === S.end) || ENDINGS[ENDINGS.length - 1];
  const seen = loadEndings().filter(id => ENDINGS.some(e => e.id === id));
  const ms = pickMilestones(), ph = S.photos.slice(-6);
  bgm.event('ending');
  let d = 0.3; const nd = (step = .35) => (d += step).toFixed(2) + 's';
  const fin = $('#finale');
  fin.innerHTML = `<div class="fin">
    <div class="years fs" style="--d:${nd(0)}">${S.age} 年</div>
    <div class="nm fs" style="--d:${nd(.4)}">${esc(S.name)}</div>
    <div class="cause fs" style="--d:${nd()}">${esc(S.cause)}</div>
    <div class="rule fs" style="--d:${nd(.5)}"></div>
    ${ms.length ? `<ul class="tl">${ms.map(m => `<li class="fs${m.bad ? ' dk' : ''}" style="--d:${nd(.22)}"><b>${m.a}岁</b>${esc(m.t)}</li>`).join('')}</ul>
    <div class="rule fs" style="--d:${nd(.4)}"></div>` : ''}
    ${ph.length ? `<div class="album fs" style="--d:${nd(.3)}">${ph.map(p => photoHTML(p.p, p.s, p.a)).join('')}</div>` : ''}
    <div class="fs" style="--d:${nd(.6)}"><span class="ttl${end.dark ? ' dark' : ''}">${esc(end.n)}</span>${S.newEnd ? '<span class="new">新结局</span>' : ''}</div>
    <div class="epi fs" style="--d:${nd(.5)}">${esc(end.e)}</div>
    <div class="score fs" style="--d:${nd(.6)}"><span id="finScore">0</span><small>人生评分 · 满分 1000</small></div>
    <div class="fs" style="--d:${nd(.9)};margin:8px 0 4px;font-size:18px">${gradeHTML(S.score)}</div>
    ${S.ach.length ? `<div class="badges">${S.ach.map(id => ACH.find(a => a[0] === id)).filter(Boolean).map(([, n, s]) => `<span class="badge" style="--d:${nd(.07)}"><i>${esc(s)}</i>${esc(n)}</span>`).join('')}</div>` : ''}
    <div class="coll fs" style="--d:${nd(.3)}">这一世解锁成就 ${S.ach.length} 个 · 已收集结局 ${seen.length} / ${ENDINGS.length}</div>
    <div class="row fs" style="--d:${nd(.2)}"><button class="btn primary" id="finCard">生成人生总结图</button><button class="btn" id="finAgain">再活一次</button>${heirList().length ? '<button class="btn" id="finHeir">传给下一代</button>' : ''}<button class="btn" id="finClose">回看人生记录</button></div>
  </div>`;
  fin.hidden = false; fin.scrollTop = 0;
  const scoreAt = reduced ? 0 : parseFloat(fin.querySelector('.score').style.getPropertyValue('--d')) * 1000;
  const score = S.score;
  setTimeout(() => { const el = $('#finScore'); if (el) animateNumber(el, 0, score, v => Math.round(v)); }, scoreAt);
  if (score >= 750){
    const me = S;
    setTimeout(() => { if (S !== me) return; cue(score >= 950 ? 'fireworks' : score >= 850 ? 'meteors' : 'glitter'); toast(`<b>${GRADE(score)[0]}</b>　${GRADE(score)[1]}`, 'ach'); }, scoreAt + 900);
    if (score >= 850) setTimeout(() => { if (S === me) cue(score >= 950 ? 'glitter' : 'fireworks'); }, scoreAt + 2600);
    if (score >= 950) setTimeout(() => { if (S === me) cue('meteors'); }, scoreAt + 4200);
  }
  $('#finAgain').onclick = () => { fin.hidden = true; clearSave(); showStart(); };
  $('#finClose').onclick = () => { fin.hidden = true; };
  $('#finCard').onclick = showShareCard;
  if ($('#finHeir')) $('#finHeir').onclick = heirMenu;
  $('#finClose').focus({preventScroll:true});
}

/* ---------- screens ---------- */
function showStart(){
  S = null; prev = null;
  queue = []; modalOpen = false; $('#modal').hidden = true;
  fxLayer.clear();
  $('#finale').hidden = true;
  $('#game').hidden = true; $('#start').hidden = false; $('#tools').hidden = true;
  document.body.classList.add('scroll');
  $('#stats').innerHTML = '';
  $('#nm').value = randName(gender);
  const [sc, p] = skyScene(); skyBg.set(sc, p); bgm.scene(sc);
  const saved = load();
  const rb = $('#resumeBox'); rb.innerHTML = '';
  if (saved && saved.alive){
    const b = document.createElement('button');
    b.className = 'btn resume';
    b.textContent = `继续上一世：${saved.name}，${saved.age} 岁`;
    b.onclick = () => { S = saved; showGame(); };
    rb.appendChild(b);
  }
  const seen = loadEndings(), got = loadAch();
  const ne = ENDINGS.filter(e => seen.includes(e.id)).length, na = ACH.filter(a => got.includes(a[0])).length;
  $('#collection').innerHTML = `<details><summary>结局 ${ne} / ${ENDINGS.length} · 成就 ${na} / ${ACH.length}<span>点开查看</span></summary>
    <div class="lab">结局图鉴</div>
    <div class="ends">${ENDINGS.map(e => `<span class="end-chip ${seen.includes(e.id) ? 'got' : ''}">${seen.includes(e.id) ? esc(e.n) : '？？？'}</span>`).join('')}</div>
    <div class="lab">成就</div>
    <div class="ends">${ACH.map(([id, n, s]) => `<span class="end-chip ${got.includes(id) ? 'got' : ''}">${got.includes(id) ? `<i>${esc(s)}</i>${esc(n)}` : '？？？'}</span>`).join('')}</div></details>${bookHTML()}`;
}
/* 生平簿：活过的每一世都记一笔 */
function bookHTML(){
  const all = loadScores();
  if (!all.length) return '';
  const best = all.reduce((a, b) => b.s > a.s ? b : a);
  const row = x => { const e = ENDINGS.find(k => k.id === x.e), t = x.t && TAL(x.t); return `<span class="end-chip got" style="display:flex;justify-content:space-between;gap:10px;text-align:left"><span>${esc(x.n)} · ${x.a} 岁${x.g > 1 ? ` · 第 ${x.g} 代` : ''}${t ? ` · ${t.n}` : ''}${e ? ` · ${esc(e.n)}` : ''}</span><b>${x.s} 分 ${GRADE(x.s)[0]}</b></span>`; };
  return `<details style="margin-top:10px"><summary>生平簿 · 活过 ${all.length} 世 · 最高 ${best.s} 分<span>点开查看</span></summary>
    <div class="lab">最近的人生</div>
    <div class="ends" style="display:grid;grid-template-columns:1fr;gap:6px">${all.slice(-12).reverse().map(row).join('')}</div>
    <div class="lab">活得最精彩的一世</div>
    <div class="ends" style="display:grid;grid-template-columns:1fr;gap:6px">${row(best)}</div></details>`;
}
function showGame(){
  $('#start').hidden = true; $('#game').hidden = false;
  render();
  if (S.alive && !S.tal) talentDraw();
}
function setGender(g){
  gender = g;
  $('#gm').setAttribute('aria-pressed', g === 'm'); $('#gf').setAttribute('aria-pressed', g === 'f');
  $('#nm').value = randName(g);
}

/* ---------- persistence ---------- */
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function fixSave(s){ if (s){ s.items = s.items || []; s.debts = s.debts || []; s.yr = s.yr || {}; s.hab = s.hab || {}; } return s; }
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); return s && s.v === 3 ? fixSave(s) : null; } catch (e) { return null; } }
function clearSave(){ try { localStorage.removeItem(KEY); } catch (e) {} }
function loadEndings(){ try { return JSON.parse(localStorage.getItem(EKEY) || '[]'); } catch (e) { return []; } }
function saveEndings(a){ try { localStorage.setItem(EKEY, JSON.stringify(a)); } catch (e) {} }
function loadAch(){ try { return JSON.parse(localStorage.getItem(AKEY) || '[]'); } catch (e) { return []; } }
function saveAch(a){ try { localStorage.setItem(AKEY, JSON.stringify(a)); } catch (e) {} }

/* ---------- wire up ---------- */
$('#gm').onclick = () => setGender('m');
$('#gf').onclick = () => setGender('f');
$('#rand').onclick = () => { $('#nm').value = randName(gender); };
$('#go').onclick = () => newLife(($('#nm').value.trim() || randName(gender)).slice(0, 8), gender);
$('#nm').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#next').onclick = nextYear;
$('#albumBtn').onclick = () => {
  if (!S || !S.photos.length || modalOpen) return;
  modal('相册', '', [{l:'合上相册'}], `一共 ${S.photos.length} 张`, `<div class="album">${S.photos.slice(-12).reverse().map(p => photoHTML(p.p, p.s, p.a)).join('')}</div>`, {wide:true, free:true});
};
$('#goodsBtn').onclick = showGoods;
$('#musicBtn').onclick = () => bgm.toggle();
bgm.updateBtn();
$('#profileBtn').onclick = () => {
  if (!S || modalOpen) return;
  modal(S.name, '', [{l:'关闭'}], `${S.gender === 'm' ? '男' : '女'} · ${S.age} 岁 · ${FAM.find(x => x.id === S.origin).n}`, `<div class="chips">${chipsHTML()}</div><dl class="info">${infoHTML()}</dl>`, {free:true});
};
let restartArmed = false;
$('#restart').onclick = () => {
  const b = $('#restart');
  if (!restartArmed){ restartArmed = true; b.textContent = '确认放弃？'; b.classList.add('armed'); setTimeout(() => { restartArmed = false; b.textContent = '重来'; b.classList.remove('armed'); }, 3000); return; }
  restartArmed = false; b.textContent = '重来'; b.classList.remove('armed');
  clearSave(); showStart();
};
document.addEventListener('keydown', e => {
  if (e.key === ' ' && S && S.alive && !modalOpen && !['INPUT','BUTTON','SUMMARY'].includes(document.activeElement.tagName)){ e.preventDefault(); nextYear(); }
  if (e.key === 'Escape' && !$('#finale').hidden) $('#finale').hidden = true;
});

window.claude?.hot?.snapshot?.(() => ({S}));
function start(data){
  const s = fixSave((data && data.S && data.S.v === 3 && data.S) || load());
  if (s && s.alive){ S = s; showGame(); } else showStart();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
