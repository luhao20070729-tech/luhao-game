<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>浮生一世</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: 一屏装下整个人生——背后是一片会随年龄变色的天空和远山（清晨→正午→黄昏→夜），前面是几块磨砂玻璃面板：
   档案、人生记录、今年的行动。手机上三块上下排满一屏，不用滑动页面；电脑上左右两栏。 */
:root{
  --bg:#E4EBE7; --ink:#16221F; --muted:#56665F; --line:rgba(36,58,52,.16);
  --panel:#F7FAF8; --glass:rgba(249,252,250,.72); --glass-strong:rgba(252,254,253,.9); --glass-line:rgba(255,255,255,.65); --sunk:rgba(228,236,232,.7);
  --accent:#1E6F62; --accent-2:#2A8C7B; --on-accent:#FFFFFF; --seal:#A8432F;
  --good:#2D7A4B; --bad:#B23B32; --event:#A87A20;
  --hp:#C5483E; --iq:#3A6CB3; --lk:#AE4F92; --joy:#C98A1B; --stress:#6E5A9E;
  --toast-bg:#16221F; --toast-ink:#F2F7F5;
  --shadow:0 18px 40px -24px rgba(20,34,30,.55);
  --sky-dark:0;
  /* 谢幕页、照片纸、成就奖章在两种主题下颜色固定 */
  --fin-bg:#0D1412; --fin-ink:#E8EFEC; --fin-muted:#8FA39C; --fin-gold:#E3B95A; --fin-line:#26332F; --fin-dark:#C9827A;
  --paper:#FBF8F1; --paper-ink:#3A3A36; --medal-ink:#FFFFFF;
  --f-display:"ZCOOL XiaoWei","STKaiti","KaiTi",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1210; --ink:#E4EEEA; --muted:#97A9A2; --line:rgba(200,230,220,.13);
    --panel:#152019; --glass:rgba(14,21,19,.7); --glass-strong:rgba(18,26,24,.92); --glass-line:rgba(200,235,225,.12); --sunk:rgba(6,12,10,.5);
    --accent:#4BB9A3; --accent-2:#5FCDB6; --on-accent:#0B1513; --seal:#E07A63;
    --good:#6CC891; --bad:#F07D70; --event:#E3B95A;
    --hp:#EE7468; --iq:#79A5EA; --lk:#DB86C2; --joy:#EDB548; --stress:#A994DC;
    --toast-bg:#E2ECE8; --toast-ink:#0F1614;
    --shadow:0 18px 40px -20px rgba(0,0,0,.8);
    --sky-dark:1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1210; --ink:#E4EEEA; --muted:#97A9A2; --line:rgba(200,230,220,.13);
  --panel:#152019; --glass:rgba(14,21,19,.7); --glass-strong:rgba(18,26,24,.92); --glass-line:rgba(200,235,225,.12); --sunk:rgba(6,12,10,.5);
  --accent:#4BB9A3; --accent-2:#5FCDB6; --on-accent:#0B1513; --seal:#E07A63;
  --good:#6CC891; --bad:#F07D70; --event:#E3B95A;
  --hp:#EE7468; --iq:#79A5EA; --lk:#DB86C2; --joy:#EDB548; --stress:#A994DC;
  --toast-bg:#E2ECE8; --toast-ink:#0F1614;
  --shadow:0 18px 40px -20px rgba(0,0,0,.8);
  --sky-dark:1;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
body.scroll{overflow:auto}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
#fxc{position:fixed;inset:0;width:100%;height:100%;z-index:55;display:block;pointer-events:none}
.game.shake{animation:quakeBox .5s linear 3}
.game.jolt{animation:quakeBox .28s linear 2}
@keyframes quakeBox{20%{transform:translate(-7px,2px) rotate(-.4deg)}40%{transform:translate(6px,-3px)}60%{transform:translate(-5px,3px) rotate(.3deg)}80%{transform:translate(3px,-1px)}}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:12px}
body.scroll .app{height:auto;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--glass-line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;letter-spacing:.06em}

/* header */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;letter-spacing:.08em;line-height:1.1;text-shadow:0 1px 12px var(--glass)}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.04em;margin-left:10px}
.tools{display:flex;align-items:center;gap:6px;min-width:0}
.who{font-size:12.5px;color:var(--muted);margin-right:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tool{padding:6px 12px;border-radius:99px;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:12.5px;white-space:nowrap}
.tool:disabled{opacity:.45;cursor:default}
.tool.armed{background:var(--bad);color:var(--on-accent);border-color:var(--bad)}
.right{display:flex;align-items:center;gap:6px;min-width:0}
.tool.music.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tool.music.on::after{content:"";display:inline-block;width:6px;height:6px;margin-left:5px;border-radius:50%;background:var(--on-accent);vertical-align:1px;animation:throbDot 1.2s ease-in-out infinite}
@keyframes throbDot{50%{opacity:.3}}
.tool.mob{display:none}

/* start */
.start{max-width:560px;width:100%;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px;animation:rise .8s ease both}
.start h2{font-size:24px}
.start p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.field input{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--sunk)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent-2)}
.resume{border:1px dashed var(--accent);background:transparent;color:var(--accent);text-align:left}
.collection{border-top:1px dashed var(--line);padding-top:12px}
.collection summary{cursor:pointer;font-size:13px;letter-spacing:.06em;padding:4px 0}
.collection summary span{color:var(--muted);font-size:12px;margin-left:8px}
.collection details[open] summary span{display:none}
.collection .lab{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:12px 0 8px}
.ends{display:flex;flex-wrap:wrap;gap:6px}
.end-chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.end-chip.got{border-color:var(--event);color:var(--ink)}
.start .credit{font-size:11.5px;line-height:1.5;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.start .credit a{color:var(--accent)}
.end-chip i{font-style:normal;font-family:var(--f-display);color:var(--seal);margin-right:4px}

/* game shell */
.game{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hero log" "acts log";gap:12px}
.hero{grid-area:hero;display:flex;flex-direction:column;gap:10px;min-width:0}
.ledger{grid-area:log;display:flex;flex-direction:column;min-height:0;min-width:0}
.acts,.ending{grid-area:acts;display:flex;flex-direction:column;gap:10px;min-height:0}

.agebox{display:flex;align-items:center;gap:8px;min-width:0}
.age{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:52px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.age.tick{animation:tick .6s cubic-bezier(.25,1.5,.5,1)}
@keyframes tick{0%{transform:translateY(-16px) rotateX(70deg);opacity:.1}100%{transform:none;opacity:1}}
.age-unit{font-family:var(--f-display);font-size:20px;align-self:flex-end;margin-bottom:6px}
.stage{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--seal);color:var(--seal);letter-spacing:.12em;white-space:nowrap}
.purse{margin-left:auto;text-align:right;min-width:0}
.purse small{display:block;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.money{font-family:var(--f-mono);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;transition:color .3s;white-space:nowrap}
.money.flash-up{color:var(--good)} .money.flash-dn{color:var(--bad)}
.neg{color:var(--bad)}
.brief{display:none;font-size:12.5px;color:var(--muted);gap:4px 10px;flex-wrap:wrap}
.brief b{font-weight:500;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;animation:fade .4s ease}
.chip.trait{border-color:var(--accent);color:var(--accent)}
.chip.ill{border-color:var(--bad);color:var(--bad)}
.chip.state{background:var(--seal);border-color:var(--seal);color:var(--on-accent)}
.chip.vice{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.stats{display:grid;gap:8px}
.stat{position:relative;display:grid;grid-template-columns:3em 1fr 2.4em;grid-template-areas:"k bar v";align-items:center;gap:10px;font-size:13px}
.stat .k{grid-area:k}
.stat .v{grid-area:v;font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.stat .bar{grid-area:bar}
.stat.inv .k{color:var(--stress)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.3,.8,.3,1);background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.35))}
.stat.hot .bar{animation:throb 1.2s ease-in-out infinite}
@keyframes throb{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 35%,transparent)}}
.float{position:absolute;right:-4px;top:-8px;font-family:var(--f-mono);font-size:12px;font-weight:700;pointer-events:none;animation:floatUp 1.3s ease-out forwards}
.float.up{color:var(--good)} .float.dn{color:var(--bad)}
.stat.inv .float.up{color:var(--bad)} .stat.inv .float.dn{color:var(--good)}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.info{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.info dt{color:var(--muted)}
.info dd{margin:0;text-align:right;min-width:0}

/* actions */
.acts-head{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:12.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab sup{font-size:9.5px;margin-left:2px;opacity:.8}
.ap{flex:none;display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.ap i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent);transition:background .25s,transform .25s}
.ap i.on{background:var(--accent)}
.ap i:not(.on){transform:scale(.8)}
.act-grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-content:start;padding:2px}
.act{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-height:46px;padding:7px 10px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);text-align:left;transition:border-color .15s,transform .12s,background .15s;animation:fade .3s ease both;animation-delay:calc(var(--i,0) * 25ms)}
.act:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.act:active:not(:disabled){transform:scale(.96)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act b{font-weight:600;font-size:13.5px;line-height:1.3}
.act span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.act.risky b::after{content:" ⚠";color:var(--bad);font-size:11px}
.rip{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--accent);opacity:.35;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(28);opacity:0}}
.next{flex:none;position:relative;overflow:hidden;width:100%;padding:13px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-size:20px;letter-spacing:.12em;transition:background .2s;box-shadow:0 10px 24px -12px var(--accent)}
.next:hover{background:var(--accent-2)}
.next::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-100%)}
.next.sweep::after{animation:sweep .7s ease}
@keyframes sweep{to{transform:translateX(100%)}}

/* ledger */
.ledger-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.ledger-head span{font-size:12px;color:var(--muted)}
.log{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.year{display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.year:first-child{border-top:0}
.year.enter{animation:slideIn .5s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(-14px)}}
.year .y{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.year .y small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted)}
.year.now .y{color:var(--seal)}
.items{display:flex;flex-direction:column;gap:6px;min-width:0}
.item{padding-left:11px;border-left:3px solid var(--line);font-size:14px}
.item.new{animation:itemIn .5s ease-out both;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes itemIn{from{opacity:.15;transform:translateX(-10px)}}
.item.g{border-color:var(--good)} .item.b{border-color:var(--bad)} .item.e{border-color:var(--event)}
.item.e{font-weight:600}
.fx{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:1px;font-weight:400}
.fx em{font-style:normal;font-family:var(--f-mono);font-size:11px;padding:0 6px;border-radius:5px;background:var(--sunk);border:1px solid var(--line)}
.fx em.up{color:var(--good)} .fx em.dn{color:var(--bad)}
.fx em.inv.up{color:var(--bad)} .fx em.inv.dn{color:var(--good)}

/* side ending card */
.ending .tag{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.ending .title{font-family:var(--f-display);font-size:30px;line-height:1.2;color:var(--seal)}

/* toasts */
.toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--toast-bg);color:var(--toast-ink);padding:8px 16px;border-radius:99px;font-size:13px;animation:toastIn 2.8s ease forwards}
@keyframes toastIn{0%{opacity:0;transform:translateY(-12px)}10%,82%{opacity:1;transform:none}100%{opacity:0}}

/* 新阶段：大字 + 一笔朱砂 */
.stagecard{position:fixed;inset:0;z-index:65;display:grid;place-items:center;pointer-events:none}
.stagecard div{text-align:center;padding:22px 46px 18px;border-radius:24px;background:var(--glass-strong);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-line);box-shadow:0 30px 60px -24px rgba(0,0,0,.55);animation:stageIn 2.6s ease forwards}
.stagecard b{display:block;font-family:var(--f-display);font-weight:400;font-size:64px;line-height:1.1;letter-spacing:.3em;margin-right:-.3em}
.stagecard i{display:block;height:7px;margin:8px auto 6px;border-radius:4px;background:var(--seal);width:0;animation:brush .8s cubic-bezier(.3,.8,.3,1) .35s forwards}
.stagecard small{display:block;font-size:13px;letter-spacing:.2em;color:var(--muted)}
@keyframes stageIn{0%{opacity:0;transform:scale(1.18);filter:blur(8px)}16%{opacity:1;transform:none;filter:none}78%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes brush{to{width:72%}}

/* 成就解锁：奖章翻转落下、高光扫过、按主题迸出粒子 */
.achs{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.ach{--m1:#FFE7A0;--m2:#C8902A;position:relative;display:flex;align-items:center;gap:12px;max-width:100%;padding:9px 20px 9px 9px;border-radius:99px;background:var(--glass-strong);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glass-line);box-shadow:0 18px 40px -16px rgba(0,0,0,.55),0 0 0 1px color-mix(in srgb,var(--m2) 40%,transparent);animation:achIn .7s cubic-bezier(.2,1.35,.4,1) both}
.ach.out{animation:achOut .55s ease forwards}
@keyframes achIn{from{opacity:0;transform:translateY(-40px) scale(.7)}}
@keyframes achOut{to{opacity:0;transform:translateY(-30px) scale(.85)}}
.medal{position:relative;flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:29px;color:var(--medal-ink);background:radial-gradient(circle at 34% 28%,var(--m1),var(--m2) 72%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 0 3px var(--m2),0 0 22px -2px var(--m2);overflow:hidden;animation:coin 1s cubic-bezier(.2,.9,.3,1.15) both .1s;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.medal::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.8) 50%,transparent 65%);transform:translateX(-130%);animation:shine 1s ease .85s forwards}
@keyframes coin{0%{transform:perspective(200px) rotateY(600deg) scale(.2);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes shine{to{transform:translateX(130%)}}
.ach .txt{min-width:0}
.ach .txt small{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted)}
.ach .txt b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burst{position:absolute;left:36px;top:50%;width:0;height:0}
.pt{position:absolute;left:0;top:0;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--m1);box-shadow:0 0 6px var(--m2);opacity:0;animation:burst 1.2s cubic-bezier(.12,.7,.3,1) forwards;animation-delay:calc(.4s + var(--dl,0s));font-size:13px;line-height:8px;text-align:center;color:var(--m2)}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1.2) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.5) rotate(var(--r))}}

let S = null;
let queue = [];
let modalOpen = false;
let gender = 'm';
let prev = null;          // 上一次渲染时的数值，用来做动画
let logNodes = new Map();

/* ---------- helpers ---------- */
function randName(g){ return pick(SURN) + pick(g === 'f' ? GF : GM); }
const other = () => S.gender === 'm' ? 'f' : 'm';
const tier = () => FAM[S.fam].tier;
const trait = () => TRAITS[S.trait];
const hasIll = id => S.ills.some(i => i.id === id);
const parentsAlive = () => S.parents.alive.some(Boolean);
function fmt(n){
  const s = n < 0 ? '−' : '';
  const a = Math.abs(n);
  if (a >= 1e8) return s + (a/1e8).toFixed(2).replace(/\.?0+$/,'') + '亿';
  if (a >= 1e4) return s + (a/1e4).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/,'') + '万';
  return s + Math.round(a) + '元';
}
function ch(k, d){
  if (k === 'stress'){
    if (d > 0) d = Math.max(1, Math.round(d * trait().stress));
    else if (d < 0){
      // 压力能降，但只要生活里还有工作、学业、债务这些事，就降不到底
      const floor = S.sfloor ?? 1;
      if (S.st.stress <= floor) return;
      S.st.stress = Math.max(floor, S.st.stress + d);
      return;
    }
  }
  S.st[k] = clamp(S.st[k] + d, 0, 100);
}
/* 爸妈只剩一个在身边（离婚、去世、单亲）时，文字里只写还在的那一个。
   “XX的爸妈”“我爸妈”说的是别人的父母，不改；raw 表示这句话本来就在讲两个人，不改 */
function paText(t){
  if (!S || typeof t !== 'string' || !t) return t;
  const [d, m] = S.parents.alive;
  if (d === m) return t;
  const both = /(?<![的我])(爸妈|父母)/.test(t);
  if (m){
    t = t.replace(/(?<![的我])(爸妈|父母)/g, '妈妈').replace(/(?<![当])爸爸(?!妈妈)/g, '妈妈');
    if (both) t = t.replace(/他们/g, '她');
  } else {
    t = t.replace(/(?<![的我])(爸妈|父母)/g, '爸爸').replace(/(?<![当的爸])妈妈/g, '爸爸').replace(/你妈(?!妈)/g, '你爸');
    if (both) t = t.replace(/他们/g, '他');
  }
  return t;
}
function L(text, kind = 'n', fx = {}, raw = false){
  if (S.done) return;
  if (!raw) text = paText(text);
  let g = S.log[S.log.length - 1];
  if (!g || g.age !== S.age){ g = {age:S.age, items:[]}; S.log.push(g); }
  const shown = [];
  for (const [k, d] of Object.entries(fx)){
    if (!d) continue;
    if (k === 'money'){ S.money += d; shown.push([k, d]); continue; }
    const b = S.st[k]; ch(k, d);
    if (S.st[k] !== b) shown.push([k, S.st[k] - b]);
  }
  g.items.push({t:text, k:kind, fx:shown});
  if (kind === 'e') S.ms.push({a:S.age, t:text});
  if (kind !== 'n') cue(fxFor(text));
}
/* 行动的收益：可能偷懒没效果；数值越高越难涨 */
function grow(k, lo, hi){
  if (chance(trait().lazy + (S.st.stress >= 80 ? .15 : 0))) return 0;
  const v = S.st[k], room = .3 + (100 - v) / 100 * .9;
  return Math.max(0, Math.round((lo + Math.random() * (hi - lo)) * room));
}
function unlock(id){
  if (S.ach.includes(id)) return;
  S.ach.push(id);
  const all = loadAch(); if (!all.includes(id)){ all.push(id); saveAch(all); }
  const a = ACH.find(x => x[0] === id);
  if (a) achPop(a);
  if (OBTAIN[id]) gainItem(...OBTAIN[id]);
}
/* 人生节点：只给“对这个人来说重要”的时刻用，会弹出印章动画 */
function node(seal, title, sub = '', bad = false){
  if (S.done) return;
  title = paText(title); sub = paText(sub);
  S.ms.push({a:S.age, t:title, big:1, bad});
  cue(fxFor(title + sub) || (bad ? 'rain' : 'sunburst'));
  queue.push({ms:true, seal, title, sub, bad});
  if (!modalOpen && !hold) showNext();
}
function jobName(){ return S.job ? LV[S.job.lv] + S.job.t : ''; }
function stage(a){
  if (a <= 2) return '婴儿'; if (a <= 5) return '幼儿'; if (a <= 12) return '童年';
  if (a <= 17) return '少年'; if (a <= 29) return '青年'; if (a <= 44) return '壮年';
  if (a <= 59) return '中年'; return '老年';
}
function mode(){
  if (S.jail) return 'jail';
  if (S.flags.homeless) return 'homeless';
  if (S.flags.monk) return 'monk';
  const a = S.age;
  if (a < 3) return 'baby'; if (a < 6) return 'tot'; if (a < 13) return 'kid'; if (a < 18) return 'teen';
  if (S.school && S.school.lvl >= 4) return 'uni';
  return a >= 60 ? 'old' : 'adult';
}
/* 对象也有自己的存款和收入；你越有钱，越可能遇到门当户对的人，也越可能遇到冲着钱来的人 */
function setPartner(name, teen = false){
  const w = worth(), r = Math.random();
  let wealth = teen ? 0 : r < .55 ? R(0, 20) * 10000 : r < .85 ? R(20, 100) * 10000 : r < .97 ? R(100, 1000) * 10000 : R(1000, 8000) * 10000;
  if (!teen && w >= 5e6 && chance(.3)) wealth = Math.max(wealth, R(300, 3000) * 10000);
  S.partner = {name, years:0, married:false, teen, since:0, wealth, inc:teen ? 0 : R(3, 30) * 10000, digger:!teen && w >= 2e6 && wealth < w / 10 && chance(.3)};
  S.flags.everLoved = 1;
}
function breakup(msg){ L(msg, 'b', {happy:-12, stress:6}); S.partner = null; }
/* 离婚：没签婚前协议的话，两个人的钱加在一起对半分——对方更有钱，你反而能分到钱。share 是分给对方的比例，0 表示各走各的 */
function divorce(msg, share = .5){
  const P = S.partner || {}, mine = Math.max(0, S.money), theirs = P.wealth || 0;
  let delta = 0, note = '';
  if (P.prenup){ note = '好在签过婚前协议，财产各归各。'; }
  else if (share > 0){
    delta = Math.round((mine + theirs) * (1 - share) - mine);
    if (share >= 1) delta = -mine;
    note = delta > 0 ? `对方比你有钱，按规矩你分到了 ${fmt(delta)}。` : delta < 0 ? `财产分割后，你少了 ${fmt(-delta)}。` : '';
  }
  L(msg + note, 'b', {happy:-20, stress:15, money:delta});
  const h = S.assets.houses;
  if (h.length && !P.prenup && share > 0) S.assets.houses = h.slice(0, Math.floor(h.length * (1 - share) + .01));
  S.partner = null; S.affair = null;
  S.flags.divorces = (S.flags.divorces || 0) + 1;
  unlock('divorce');
}
function spend(){ S.ap = Math.max(0, S.ap - 1); }
function setJob(t, pay, o = {}){
  if (S.job && S.job.t !== t) S.flags.jobs = (S.flags.jobs || 0) + 1;
  if (!S.job) S.flags.jobs = (S.flags.jobs || 0) + 1;
  if ((S.flags.jobs || 0) >= 5) unlock('jobhop');
  const j = JOBS.find(x => x.t === t) || {};
  S.job = {t, pay, lv:0, perf:0, yrs:0, stress:o.stress ?? j.stress ?? 5, risk:o.risk ?? j.risk ?? 1, co:o.co ?? j.co ?? .03, arrears:o.arrears ?? j.arrears ?? 0};
  if (!S.flags.firstJob){
    S.flags.firstJob = 1;
    if (tier() === 0 || S.edu <= 2 || S.flags.wasHomeless) node('职', '有了第一份工作', `${t}，年薪 ${fmt(pay)}。对你来说，这是一个新的开始。`);
  }
}
function kidOfAge(lo, hi){ return S.kids.find(k => !k.dead && S.age - k.b >= lo && S.age - k.b <= hi); }
function addIll(id, text){
  if (hasIll(id)) return;
  S.ills.push({id, yrs:0, tries:0, tx:-9});
  if (text) L(text, 'b', {stress:5, happy:-3});
  if (id === 'cancer') node('病', '确诊癌症', '医生把你家人叫到了走廊里。', true);
}
function cureIll(il, self){
  S.ills = S.ills.filter(x => x !== il);
  const d = ILL[il.id];
  if (d.back) S.cured.push(il.id);
  L(self ? `你的${d.n}不知不觉自己好了。` : `你的${d.n}治好了！`, 'g', {happy:8, stress:-8});
  if (il.id === 'cancer'){ unlock('survivor'); node('愈', '战胜了癌症', il.tries ? `治了 ${il.tries} 次，花了很多钱，但你活下来了。` : '没怎么治，肿瘤自己消失了。医生说这是奇迹。'); }
  if (il.id === 'congenital'){ unlock('bornill'); node('愈', '治好了先天性心脏病', '从出生就跟着你的病，终于好了。'); }
  if (il.id === 'leg'){ node('立', '重新站了起来', '康复训练了无数次，你终于又能走路了。'); }
}
function goJail(yrs, why){
  S.jail = yrs; S.flags.jailed = 1; unlock('jail');
  if (S.job){ S.job = null; }
  if (S.biz){ S.biz = null; }
  if (S.affair) S.affair = null;
  L(why, 'b', {happy:-25, stress:20});
  node('囚', '身陷囹圄', `被判有期徒刑 ${yrs} 年。`, true);
  if (S.partner && chance(S.partner.married ? .45 : .8)){
    if (S.partner.married) divorce(`${S.partner.name}提出了离婚。`, .3); else breakup(`${S.partner.name}离开了你。`);
  }
}
function becomeHomeless(msg){
  const f = S.flags;
  f.homeless = 1; f.wasHomeless = 1; f.broke = 0; f.home = 0;
  if (S.money < 0){ f.oldDebt = -S.money; S.money = 0; }
  S.job = null; S.biz = null;
  unlock('homeless');
  L(msg, 'b', {happy:-20, stress:15});
  node('漂', '流落街头', '你没有家了。', true);
  if (S.partner && chance(.6)){
    if (S.partner.married) divorce(`${S.partner.name}受不了这样的日子，和你离了婚。`, 0); else breakup(`${S.partner.name}离开了你。`);
  }
}
function leaveStreet(msg){
  S.flags.homeless = 0;
  unlock('standup');
  L(msg, 'e', {happy:15, stress:-15});
  node('家', '有了落脚的地方', '一间很小的出租屋，但它有门，有锁，有一张床。');
}
function retire(msg){
  S.pension = Math.round(S.job.pay * (S.job.t === '公务员' || S.job.t === '局长' ? .7 : .45));
  S.retired = true;
  L(msg || `你从${jobName()}的岗位上退休了，每年养老金 ${fmt(S.pension)}。`, 'e', {happy:6, stress:-15});
  S.job = null;
}
function payFor(cost, who = '你'){
  // 未成年时，治病的钱由家里出；穷人家会因此背债
  if (S.age < 18){
    if (tier() <= 1) S.flags.famDebt = (S.flags.famDebt || 0) + cost;
    return 0;
  }
  return -cost;
}

/* ---------- toasts ---------- */
function toast(html, cls = ''){
  const t = document.createElement('div');

/* ---------- modal ---------- */
let curNeed = null;   // 随机事件的前提条件：排队期间如果失效（比如工作已经丢了），这个弹窗就跳过
let hold = false;     // 过年结算期间先把弹窗攒着，结算完再依次弹出
function modal(title, text, choices, tag = '人生抉择', img = '', o = {}){
  if (!o.raw){ title = paText(title); text = paText(text); choices.forEach(c => { c.l = paText(c.l); }); }
  queue.push({title, text, choices, tag, img, need:curNeed, ...o});
  if (!modalOpen && !hold) showNext();
}
function showNext(){
  let m = queue.shift();
  while (m && !m.ms && m.need && !m.need()) m = queue.shift();
  if (!m){ modalOpen = false; $('#modal').hidden = true; return; }
  modalOpen = true;
  const sh = $('#sheet');
  if (m.ms){
    sh.className = 'sheet ms' + (m.bad ? ' bad' : '');
    sh.innerHTML = `<div class="seal">${esc(m.seal)}</div><div class="tag">${S.age} 岁 · 人生节点</div><h3 id="mt">${esc(m.title)}</h3>${m.sub ? `<p>${esc(m.sub)}</p>` : ''}<div class="choices"><button class="choice"><b>继续</b></button></div>`;
    sh.querySelector('button').onclick = () => { afterChange(); showNext(); };
  } else {
    sh.className = 'sheet' + (m.wide ? ' wide' : '');
    sh.innerHTML = `<div class="tag">${esc(m.tag)}</div><h3 id="mt">${esc(m.title)}</h3>${m.img || ''}${m.text ? `<p>${esc(m.text)}</p>` : ''}<div class="choices"></div>`;
    const box = sh.querySelector('.choices');
    m.choices.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'choice'; b.style.setProperty('--i', i);
      // 只显示价钱这类事实，不提示“有风险”“可能被抓”之类的后果
      const hint = c.d && /\d|万|元|家里出|借钱|不消耗|首付|贷不了/.test(c.d) ? c.d.replace(/ · (很危险|有风险|危险|高风险|违法|可能倒欠|比较稳|大起大落|赌一把|保值|伤身)/g, '') : '';
      b.innerHTML = `<b>${esc(c.l)}</b>${hint ? `<span>${esc(hint)}</span>` : ''}`;
      if (c.dis && c.dis()) b.disabled = true;
      b.onclick = () => {
        if (!S.alive && !m.free) return;
        if (!m.need || m.need()) c.f && c.f();
        afterChange();
        showNext();
      };
      box.appendChild(b);
    });
  }
  const md = $('#modal');
  md.hidden = true; void md.offsetWidth; md.hidden = false;   // 重新触发弹出动画
  sh.scrollTop = 0;
  sh.querySelector('button:not(:disabled)')?.focus({preventScroll:true});
}

/* ---------- new life ---------- */
function newLife(name, g){
  const F = wpick(FAM), fi = FAM.indexOf(F);
  const st = {health:R(55,95), smarts:R(20,80), looks:R(20,90), happy:R(55,90), stress:R(0,10)};
  if (F.tier === 0) st.happy -= R(5, 15);
  if (F.tier >= 3) st.happy += 5;
  S = {
    _id:Date.now().toString(36) + Math.random().toString(36).slice(2, 6), v:3,
    name, gender:g, age:0, alive:true, ap:3, fam:fi, origin:F.id, trait:R(0, TRAITS.length - 1),
    st, money:0, edu:0, school:null, job:null, retired:false, pension:0, biz:null, owed:0,
    partner:null, affair:null, kids:[], grand:0,
    parents:{alive:F.id === 'orphan' ? [false,false] : F.id === 'single' ? [false,true] : [true,true], dieAt:[R(45,84), R(48,88)]},
    assets:{houses:[], cars:[], lux:0}, items:[], debts:[], yr:{}, hab:{}, ills:[], cured:[], loans:[], photos:[], mkt:0, jail:0,
    flags:{}, once:{}, ach:[], log:[], ms:[], cause:'', dtype:'', score:0, end:''
  };
  for (const k in st) st[k] = clamp(st[k], 0, 100);
  L(`${name}出生了。${F.line}`, 'e', {}, true);
  const hi = ['health','smarts','looks','happy'].sort((a, b) => st[b] - st[a])[0];
  L(`你天生${{health:'身体结实',smarts:'聪明伶俐',looks:'眉清目秀',happy:'爱笑'}[hi]}，性格${trait().n}。`, 'n');
  if (chance(F.tier === 0 ? .07 : .04)){ S.ills.push({id:'congenital', yrs:0, tries:0, tx:-9}); S.flags.bornIll = 1; L('医生在你身上查出了先天性心脏病。', 'b', {health:-R(15,25)}); }
  else if (chance(.05)) L('你是早产儿，在保温箱里住了一个月。', 'b', {health:-R(8,15)});
  if (chance(.03)){ S.flags.twin = 1; unlock('twins'); L(`你还有一个双胞胎${pick(['哥哥','姐姐','弟弟','妹妹'])}。`, 'g', {happy:3}); }
  queue = []; modalOpen = false; $('#modal').hidden = true;
  prev = null;
  save(); showGame();
}

/* ---------- 每一年 ---------- */
function nextYear(){
  if (modalOpen || !S.alive) return;
  const btn = $('#next'); btn.classList.remove('sweep'); void btn.offsetWidth; btn.classList.add('sweep');
  S.age++; S.ap = 3;
  // 记下哪些事连着好几年都在做（会越来越没新鲜感），再清空今年的次数
  S.hab = S.hab || {}; const used = S.yr || {};
  for (const k in S.hab) if (!used[k]) delete S.hab[k];
  for (const k in used) S.hab[k] = (S.hab[k] || 0) + 1;
  S.yr = {};
  hold = true;
  try {
    passive();
    if (S.alive) bodyTick();
    if (S.alive && !S.jail && !S.flags.homeless) schoolTick();
    if (S.alive) accidentRoll();
    if (S.alive && !checkDeath()){
      if (S.age >= 1 && chance(S.age < 6 ? .55 : .9)) randomEvent();
      if (S.age >= 6 && chance(.35)) randomEvent();
    }
  } finally { hold = false; }
  afterChange();
  if (S.alive && !modalOpen) showNext();
}

function passive(){
  const a = S.age, f = S.flags;
  if (a < 18) ch('health', R(-1, 2));
  else if (a < 50 && !S.ills.length && !f.homeless) ch('health', R(0, 2));   // 年轻，身体恢复得快
  // 智力：小时候长得快，二十多岁到顶，五十岁以后慢慢退化，七十五岁以后退得更快；经常动脑能延缓
  const brainy = ['认真学习','刷题','泡图书馆','课外补习','考证','写作','老年大学','下棋打牌','读经','在狱中读书','看绘本','咿呀学语'].some(k => (S.hab || {})[k]);
  let dsm = a <= 6 ? R(0, 2) : a <= 18 ? R(0, 1) : a <= 25 ? (chance(.3) ? 1 : 0) : a < 50 ? 0 : a < 65 ? -(chance(.5) ? 1 : 0) : a < 75 ? -R(0, 2) : -R(1, 3);
  if (S.school && a > 6) dsm += R(0, 1);
  if (dsm < 0 && brainy && chance(.6)) dsm = Math.ceil(dsm / 2);
  if (dsm) ch('smarts', dsm);
  if (a === 58) L(pick(['你发现自己开始记不住事了，刚放下的眼镜转身就找不到。','以前一看就懂的东西，现在要看两三遍。']), 'n');
  if (a === 72) L(pick(['你反应越来越慢，和年轻人说话常常跟不上。','你开始叫错孙辈的名字。']), 'n');
  if (a >= 30 && chance(.5)) ch('looks', -1);
  if (a >= 50) ch('looks', -R(0, 1));
  if (a >= 50) ch('health', -R(0, Math.ceil((a - 45) / (f.monk || f.hermit ? 16 : 12))));
  if (f.smoker) ch('health', -R(0, 2));
  if (f.drunkard) ch('health', -R(1, 2));
  // 压力：会自然回落；工作、学业、债务、疾病让它上升
  // 生活本身带来的压力底线：每年压力会慢慢回落到底线附近，不会清零
  let base = a < 6 ? 2 : a < 12 ? 6 : 10;
  if (S.job) base += S.job.stress * 2;
  if (S.school && S.school.lvl >= 2) base += S.school.lvl <= 3 ? 12 : 8;
  if (S.money < 0 && a >= 18 && !f.homeless) base += 12;
  if (f.homeless || S.jail) base += 18;
  base += S.ills.length * 6 + S.kids.filter(k => !k.dead && a - k.b < 18).length * 4;
  if (S.partner && S.partner.married) base -= 3;
  if (f.monk || f.hermit || S.retired) base -= 6;
  base = clamp(base, 2, 60);
  S.sfloor = Math.max(1, Math.round(base * .5));
  const curS = S.st.stress;
  if (curS > base) ch('stress', -Math.max(1, Math.round((curS - base) * (.2 + Math.random() * .15))));
  else ch('stress', Math.max(1, Math.round((base - curS) * .4)));
  if (S.st.stress >= 75){ ch('health', -R(0, 2)); ch('happy', -R(1, 2)); }
  if (S.st.happy < 20) ch('health', -R(0, 2));
  if (S.st.happy < 45) ch('happy', R(0, 2)); else if (S.st.happy > 85) ch('happy', -R(0, 1));   // 心情会慢慢回到常态
  if (S.partner && S.partner.married) ch('happy', 1);
  if (f.pet && a < 20) ch('happy', 1);
  if (f.monk || f.hermit) ch('happy', 2);
  if (S.partner) S.partner.years++;
  if (S.partner && S.partner.teen && a >= 18 && chance(.5)) breakup(`毕业后你和${S.partner.name}各奔东西，分手了。`);
  if (S.partner && S.partner.married && a - S.partner.since === 50){ unlock('golden'); node('金', '金婚', `你和${S.partner.name}结婚整整五十年了。`); }
  if (S.st.stress >= 92 && (!f.bdAt || a - f.bdAt >= 3)) breakdown();
  parentsTick();
  kidsTick();
  if (a <= 19) famBudget();
  if (S.loans.length) loansTick();
  if (S.jail) jailTick();
  else if (a >= 18) moneyTick();
  if (S.job && a >= 60 && !['大学教授','科学家','演员','歌手','家族企业董事长'].includes(S.job.t)) retire(`你到了退休年龄，从${jobName()}的岗位上退了下来，每年养老金 ${fmt(Math.round(S.job.pay * (S.job.t === '公务员' || S.job.t === '局长' ? .7 : .45)))}。`);
  if (S.job && a >= 68) retire();
}

function breakdown(){
  S.flags.bdAt = S.age; unlock('breakdown');
  const stu = S.school && S.age < 30;
  L('你的精神绷到了极限。', 'b');
  modal('崩溃', stu ? '你坐在书桌前，突然一个字都看不进去，眼泪止不住地往下掉。' : '某天早上，你怎么也起不了床，一想到要出门就喘不上气。', [
    stu ? {l:'休学一年', d:'压力大减', f:() => { S.school.end++; L('你休学了一年，在家慢慢缓了过来。', 'n', {stress:-45, happy:5}); }}
        : {l:'请长假休息', d:S.job ? '可能丢掉工作' : '', f:() => { if (S.job && chance(.35)){ L(`你请了三个月假，回来时${jobName()}的位置已经有人了。`, 'b', {stress:-40}); S.job = null; } else L('你休息了很久，慢慢找回了一点力气。', 'n', {stress:-40, happy:5}); }},
    {l:'去看心理医生', d:'1 万', f:() => L('心理医生陪你聊了很多次，你学会了怎么跟自己相处。', 'g', {stress:-35, happy:6, money:payFor(10000)})},
    {l:'咬牙硬撑', d:'伤身体', f:() => { L('你硬撑了下来，但身体开始频频报警。', 'b', {health:-R(8, 15), stress:-5}); if (chance(.35)) addIll('depress', ILL.depress.t); }},
  ], '身心');
}

function parentsTick(){
  const a = S.age, F = FAM[S.fam];
  S.parents.dieAt.forEach((d, i) => {
    if (!S.parents.alive[i] || a < d) return;
    S.parents.alive[i] = false;
    const who = i === 0 ? '父亲' : '母亲';
    L(`你的${who}去世了。`, 'b', {happy:-R(12, 20), stress:8});
    if (a < 18) node('孝', `失去了${who}`, `那年你才 ${a} 岁。`, true);
    if (!parentsAlive()){
      if (F.id === 'debt' && !S.flags.debtPaid){
        modal('父债子还', '父母走了，留下了 30 万的债务，债主找上了门。', [
          {l:'替父母还债', d:'30 万', f:() => { S.flags.debtPaid = 1; L('你咬牙接下了父母的债。', 'n', {money:-300000, stress:10}); }},
          {l:'放弃继承', f:() => L('你放弃了继承，债和你没关系了，但亲戚们背后说你不孝。', 'n', {happy:-4})},
        ], '家庭');
      } else {
        const inh = Math.round(F.gift * (2 + Math.random() * 2) - (S.flags.famDebt || 0));
        if (inh > 0) L(`你继承了家里的遗产 ${fmt(inh)}。`, 'g', {money:inh});
      }
    }
  });
  if (a === 18){
    const drain = tier() >= 2 ? (S.flags.famDrain || 0) : 0, gift = Math.max(0, F.gift - (S.flags.famDebt || 0) - drain);
    if (gift) L(drain > F.gift * .2 ? `你成年了。因为你从小花钱太多，爸妈给的成年礼比说好的少了一大截。` : '你成年了，父母给了你一笔钱。', drain > F.gift * .2 ? 'n' : 'g', {money:gift});
    else if (S.flags.famDebt) L(`你成年了。家里为了给你治病欠下了 ${fmt(S.flags.famDebt)}，爸妈到现在还在还。`, 'b', {happy:-4});
  }
}

function kidsTick(){
  const a = S.age;
  S.kids.forEach(k => {
    if (k.dead) return;
    const ka = a - k.b;
    if (ka === 6) L(`${k.n}上小学了。`, 'n', {happy:2});
    if (ka === 18){
      if (k.abroad) L(`${k.n}拿到了国外大学的录取通知书。`, 'g', {happy:8});
      else if (chance(.35 + (k.tutor || 0) * .06)) L(`${k.n}考上了大学，你在朋友圈发了九张照片。`, 'g', {happy:8});
      else L(`${k.n}没考上大学，决定先出去闯一闯。`, 'n', {happy:-2});
    }
    if (ka === 25) k.filial = chance(.45 + (k.bond || 0) * .08);
    if (ka >= 25 && ka <= 35 && !k.wed && chance(.18)){ k.wed = 1; L(`${k.n}结婚了，你在婚礼上哭得比新人还厉害。`, 'g', {happy:8}); }
  });
}

function jailTick(){
  S.jail--; S.flags.jailYrs = (S.flags.jailYrs || 0) + 1;
  ch('health', -R(0, 2));
  if (S.jail <= 0){
    S.jail = 0; unlock('free');
    L('你刑满释放了。走出大门的那一刻，阳光刺得睁不开眼。', 'e', {happy:15, stress:-10});
    node('释', '刑满释放', `在里面待了 ${S.flags.jailYrs} 年，外面的世界变了很多。`);
  }
}

function moneyTick(){
  const a = S.age, f = S.flags, notes = [];
  let inc = 0, exp = 0;
  if (f.homeless && !S.job) return;
  if (S.job){
    const j = S.job;
    j.yrs++; f.jy = f.jy || {}; f.jy[j.t] = (f.jy[j.t] || 0) + 1;
    if (chance(j.co)){
      const m = R(2, 6), got = Math.round(j.pay * (12 - m) / 12);
      inc += got; notes.push(`工资 ${fmt(got)}`);
      S.owed += j.pay - got; unlock('unpaid');
      L(`${pick(['公司资金链断了','老板一夜之间跑路了','公司被查封了','公司宣布破产'])}，你的工作没了，还被拖欠了 ${m} 个月工资。`, 'b', {happy:-12, stress:12});
      S.job = null;
    } else if (j.arrears && chance(j.arrears)){
      const owe = Math.round(j.pay * R(3, 8) / 12);
      inc += j.pay - owe; notes.push(`工钱 ${fmt(j.pay - owe)}`);
      S.owed += owe; unlock('unpaid');
      L(`年底结账，包工头说钱没到位，拖欠了你 ${fmt(owe)}。`, 'b', {happy:-6, stress:6});
    } else { inc += j.pay; notes.push(`工资 ${fmt(j.pay)}`); }
  }
  if (S.retired && S.pension){ inc += S.pension; notes.push(`养老金 ${fmt(S.pension)}`); }
  if (f.royalty){ inc += f.royalty; notes.push(`版税 ${fmt(f.royalty)}`); f.royalty = Math.round(f.royalty * .85); if (f.royalty < 2000) f.royalty = 0; }
  if (S.biz){
    const b = S.biz; b.yrs = (b.yrs || 0) + 1;
    if (chance(b.risk || .06)){
      const loss = Math.round(b.base * R(5, 15) / 10);
      L(`${pick(['市场突变','被大公司挤垮了','一笔大单收不回钱','合伙人卷款跑了'])}，你的${b.n}倒闭了，还亏了 ${fmt(loss)}。`, 'b', {happy:-15, stress:15, money:-loss});
      node('败', `${b.n}倒闭了`, `${b.yrs} 年的心血，一夜归零。`, true);
      S.biz = null;
    } else {
      const p = Math.round(b.base * (Math.random() * 1.6 - .25));
      b.base = Math.round(b.base * (0.92 + Math.random() * 0.3));
      inc += p; notes.push(p >= 0 ? `公司盈利 ${fmt(p)}` : `公司亏损 ${fmt(-p)}`);
    }
  }
  const H = S.assets.houses;
  S.mkt = clamp(S.mkt + (Math.random() - .5) * .08, -.08, .12);
  H.forEach(h => { h.v = Math.round(h.v * (1 + S.mkt + (Math.random() - .5) * .04)); });
  if (H.length > 1){ const r = Math.round(H.slice(1).reduce((s, h) => s + h.v * .02, 0)); inc += r; notes.push(`房租 ${fmt(r)}`); }
  if (tier() === 4 && parentsAlive() && !f.cutoff){ inc += 300000; notes.push('家族分红 30万'); }
  if (a >= 60){ const kk = S.kids.filter(k => !k.dead && k.filial && a - k.b >= 25); if (kk.length){ const v = kk.length * 12000; inc += v; notes.push(`孩子给的生活费 ${fmt(v)}`); } }
  if (S.money > 0) inc += Math.round(S.money * .015);
  const P = S.partner;
  if (P && P.married && P.inc){ const v = Math.round(P.inc * .5); inc += v; notes.push(`${P.name}贴补家用 ${fmt(v)}`); P.wealth = Math.round((P.wealth || 0) + P.inc * .3); }
  (S.items || []).forEach(x => { if (x.got) return; x.v = Math.round(x.v * (x.k === 'vase' ? .9 + Math.random() * .25 : x.r || .95)); if (x.k === 'yacht') exp += Math.round(x.v * .05); });
  // 开销
  const atHome = f.home && parentsAlive();
  let life = f.homeless ? 6000 : f.monk ? 3000 : S.school ? (tier() >= 2 ? 0 : 12000) : atHome ? 6000 : S.money > 1e7 ? 200000 : S.money > 1e6 ? 60000 : 22000;
  if (!f.monk && !f.homeless && !S.school && !atHome && !H.length && !f.hermit) life += 12000;
  exp += life;
  S.assets.cars.forEach(c => { exp += 6000 + Math.round(c.v * .03); c.v = Math.round(c.v * .87); });
  H.forEach(h => {
    if (h.debt > 0){
      exp += h.pay; h.debt -= Math.round(h.pay * .7);
      if (h.debt <= 0){
        h.debt = 0; L(`${h.n}的房贷终于还完了！`, 'g', {happy:8, stress:-8});
        if (tier() <= 1 && !f.firstPaid){ f.firstPaid = 1; node('家', '还清了房贷', '这套房子，终于完完全全是你的了。'); }
      }
    }
  });
  if (S.partner && S.partner.married) exp += 8000;
  S.kids.forEach(k => { const ka = a - k.b; if (!k.dead && ka < 22) exp += k.abroad && ka >= 18 ? 150000 : 15000; });
  if (S.affair && S.affair.kept) exp += 200000;
  if (S.money < 0 && !S.school) exp += Math.round(-S.money * (f.netloan ? .2 : .06));
  exp += debtTick(notes);
  if (a >= 70) exp += 6000;
  if (exp) notes.push(`开销 ${fmt(exp)}`);
  if (notes.length) L(`这一年：${notes.join('，')}。`, 'n', {money:inc - exp});
  else S.money += inc - exp;
  // 债务
  if (S.money < 0){
    f.everDebt = 1;
    if (S.money < -200000 && H.length){
      const h = H.pop(), got = Math.round(h.v * .7) - Math.max(0, h.debt);
      L(`你还不上钱，银行拍卖了你的${h.n}，到手 ${fmt(got)}。`, 'b', {happy:-12, money:got});
    } else if (S.money < -100000 && S.assets.cars.length){
      const c = S.assets.cars.pop();
      L(`你把${c.n}卖了抵债。`, 'b', {happy:-5, money:Math.round(c.v * .8)});
    }
  } else if (f.everDebt && !S.ach.includes('debtfree')){ unlock('debtfree'); L('你终于还清了所有的债。', 'g', {happy:10, stress:-12}); }
  if (f.homeless){ if (S.money >= 5000) leaveStreet('你攒够了押金，租了一间小屋。'); return; }
  if (!S.school && !S.job && !S.biz && !S.retired && !f.monk && !H.length && S.money < -30000 && !atHome) f.broke = (f.broke || 0) + 1; else f.broke = 0;
  if (f.broke >= 2) streetCrisis();
}
function streetCrisis(){
  const f = S.flags; f.broke = 0;
  modal('走投无路', `你已经欠了 ${fmt(-S.money)}，房租交不起了，房东把你的东西扔到了楼道里。`, [
    {l:'回老家投靠父母', dis:() => !parentsAlive(), f:() => { f.home = 1; L('你灰头土脸地回了老家，爸妈什么也没说，给你铺好了床。', 'n', {happy:-5, stress:-8}); }},
    {l:'找朋友借住', f:() => chance(.45) ? L('一个老同学收留了你，让你睡在他家沙发上。', 'n', {happy:-3}) : becomeHomeless('朋友们都不接你的电话了。你拖着行李箱，在桥洞下铺开了纸板。')},
    {l:'睡桥洞', f:() => becomeHomeless('你拖着行李箱，在桥洞下铺开了纸板。')},
  ], '生活');
}

/* ---------- 身体：疾病会发展、自愈、复发 ---------- */
function bodyTick(){
  const a = S.age, f = S.flags;
  if (S.ills.length) f.illYrs = (f.illYrs || 0) + 1;
  for (const il of [...S.ills]){
    const d = ILL[il.id]; il.yrs++;
    const treated = il.tx >= a - 1;
    let dr = R(d.dr[0], d.dr[1]); if (treated) dr = Math.ceil(dr / 2);
    ch('health', -dr);
    if (d.joy) ch('happy', -R(d.joy[0], d.joy[1]));
    if (d.iq) ch('smarts', -R(d.iq[0], d.iq[1]));
    const fp = d.fatal * (a >= 70 ? 1.6 : 1) * (S.st.health < 30 ? 2 : 1) * (treated ? .5 : 1);
    if (chance(fp)){ die(`因${d.n}去世`, 'ill'); return; }
    if (!d.perm && chance(d.self * (a >= 70 ? .6 : 1))) cureIll(il, true);
  }
  for (const id of [...S.cured]){
    if (chance(ILL[id].back * .5)){ S.cured.splice(S.cured.indexOf(id), 1); addIll(id, `你的${ILL[id].n}复发了。`); }
    else if (chance(.1)) S.cured.splice(S.cured.indexOf(id), 1);
  }
  if (f.homeless){ f.hlYrs = (f.hlYrs || 0) + 1; ch('health', -R(1, 3)); }
  newIll();
}
function newIll(){
  const a = S.age, f = S.flags, st = S.st;
  const P = [
    ['asthma',  a < 15 ? .006 : .002],
    ['depress', (st.stress >= 70 ? .09 : st.stress >= 50 ? .025 : .005) + (st.happy < 25 ? .05 : 0)],
    ['stomach', a >= 16 && a < 70 ? .01 + (st.stress >= 50 ? .02 : 0) + (f.drunkard ? .02 : 0) : 0],
    ['pneu',    a >= 65 ? .02 : a < 5 ? .01 : .003],
    ['bp',      a >= 40 ? .02 + (f.smoker ? .01 : 0) + (f.drunkard ? .01 : 0) : 0],
    ['sugar',   a >= 45 ? .012 : 0],
    ['heart',   a >= 50 ? .008 + (f.smoker ? .01 : 0) + (hasIll('bp') ? .02 : 0) : 0],
    ['cancer',  a >= 40 ? .003 + (a - 40) * .00015 + (f.smoker ? .004 : 0) : .0004],
    ['lung',    f.smoker && a >= 45 ? .025 : 0],
    ['liver',   f.drunkard && a >= 35 ? .03 : 0],
    ['stroke',  a >= 60 ? .007 + (hasIll('bp') ? .02 : 0) : 0],
    ['dementia',a >= 70 ? .005 + (a - 70) * .001 : 0],
  ];
  for (const [id, p] of P) if (!hasIll(id) && chance(p)){ addIll(id, ILL[id].t); return; }
}

/* ---------- 上学和考试：再聪明也可能发挥失常 ---------- */
function exam(){
  const s = S.st.stress, r = Math.random();
  const bad = .07 + (s >= 75 ? .2 : s >= 55 ? .08 : 0) + (S.ills.length ? .05 : 0);
  if (r < bad) return [-R(70, 150), pick(['考试那天你发了高烧','你太紧张，最后两道大题没写完','你涂错了答题卡','前一晚失眠，你在考场上差点睡着','路上堵车，你迟到了二十分钟'])];
  if (r > .93) return [R(30, 70), pick(['你超常发挥，压轴题全做出来了','考前押的题全中了'])];
  return [R(-35, 35), ''];
}
function schoolTick(){
  const a = S.age;
  if (a === 3 && tier() >= 1) L('你上幼儿园了，第一天哭得撕心裂肺。', 'n', {happy:-2});
  if (a === 6 && !S.school && !S.edu){
    S.school = {lvl:1, end:12};
    L(S.origin === 'orphan' && !S.flags.adopted ? '你在福利院附近的小学上学了。' : S.origin === 'rural' ? '你每天走一个小时山路去上小学。' : '你背上书包，上小学了。', 'e');
  }
  if (S.school && a >= S.school.end) graduate();
}
function graduate(){
  const lvl = S.school.lvl, a = S.age, sm = S.st.smarts;
  S.edu = Math.max(S.edu, lvl); S.school = null;
  if (lvl === 1){ L('小学毕业，升入初中。', 'n'); S.school = {lvl:2, end:a + 3}; return; }
  if (lvl === 2){
    const [d, why] = exam();
    const pts = sm + d / 5 + R(-8, 8);
    if (why) L(`中考那天，${why}。`, d < 0 ? 'b' : 'g');
    if (pts >= 45){
      if (tier() === 0 && S.origin !== 'orphan' && chance(.35)){
        modal('家里供不起', '你考上了高中，可爸妈愁得一夜没睡：学费、住宿费，家里实在拿不出来。', [
          {l:'借钱也要读', f:() => { S.flags.famDebt = (S.flags.famDebt || 0) + 20000; S.school = {lvl:3, end:a + 3}; L('爸妈挨家挨户借了钱，送你去了县城的高中。', 'g', {happy:4, stress:5}); }},
          {l:'辍学打工养家', f:() => { S.flags.dropout = 1; L('你把录取通知书压在枕头底下，跟着老乡去了南方的工厂。', 'b', {happy:-10}); }},
        ], '升学');
        return;
      }
      L('中考顺利，你考上了高中。', 'g', {happy:5}); S.school = {lvl:3, end:a + 3}; return;
    }

/* ---------- 意外：再健康也可能遇上 ---------- */
function accidentRoll(){
  const a = S.age, f = S.flags;
  let p = .035 * trait().risk;
  if (S.job) p *= S.job.risk || 1;
  if (a >= 70) p *= 1.6; if (a < 3) p *= .4;
  if (f.drunkard) p *= 1.4; if (f.homeless) p *= 1.8;
  if (S.assets.cars.some(c => c.fast)) p *= 1.5;
  if (S.jail) p *= .5;
  if (chance(p)) accident(wpick(ACC.filter(x => !x.c || x.c())));
}
function accident(x, mult = 1){
  const a = S.age;
  cue(ACCFX[x.id]);
  const t = x.id === 'fall' && a >= 65 ? '你在浴室里滑倒了' : x.t;
  const lethal = x.lethal * mult * (S.st.health < 40 ? 1.8 : 1) * (a >= 75 ? 2 : a < 14 ? .5 : 1);
  const r = Math.random();
  const med = a >= 18 ? -R(5000, 40000) : 0;
  if (r < lethal){ L(t + '。', 'b'); die(x.die || '遭遇意外，不幸离世', x.trip ? 'travel' : x.dis ? 'disaster' : 'accident'); return 'dead'; }
  if (x.dis) unlock('disaster');
  if (r < lethal + x.maim * mult){
    const lim = chance(.7) ? 'leg' : 'arm';
    L(`${t}，你${lim === 'leg' ? '失去了一条腿' : '失去了一只手臂'}。`, 'b', {health:-R(15, 30), happy:-R(15, 25), stress:15, money:med * 3});
    addIll(lim);
    node('残', lim === 'leg' ? '失去了一条腿' : '失去了一只手臂', t + '。', true);
    if (x.id === 'car') unlock('crash');
    if (x.comp) L('公司赔了你一笔工伤补偿。', 'n', {money:Math.round((S.job ? S.job.pay : 60000) * 2)});
    if (S.job && (S.job.risk || 1) >= 1.5){ L(`你没法再做${S.job.t}了。`, 'b'); S.job = null; }
    return 'maim';
  }
  if (r < lethal + (x.maim + x.hurt) * mult){
    const inj = x.inj || 'fracture';
    L(`${t}，${x.hurtT || (inj === 'burn' ? '被严重烧伤' : inj === 'pneu' ? '住进了重症监护室' : '多处骨折')}。`, 'b', {health:-R(8, 20), stress:8, money:med});
    if (inj !== 'none') addIll(inj);
    if (x.id === 'car') unlock('crash');
    if (x.comp) L('公司赔了你一笔工伤补偿。', 'n', {money:Math.round((S.job ? S.job.pay : 60000) * .5)});
    if (x.house) loseHouse();
    return 'hurt';
  }
  L(`${t}，${pick(x.safe || ['有惊无险，你毫发无伤'])}。`, 'n', {stress:5});
  if (x.house && chance(.4)) loseHouse();
  return 'ok';
}
function loseHouse(){
  const h = S.assets.houses;
  if (!h.length || !chance(.5)) return;
  const lost = h.pop();
  L(`你的${lost.n}毁了，${lost.debt > 0 ? `房贷却还得接着还（剩 ${fmt(lost.debt)}）` : '多年的积蓄化为乌有'}。`, 'b', {happy:-15, money:lost.debt > 0 ? -lost.debt : 0});
}

/* ---------- 死亡和结局 ---------- */
function checkDeath(){
  if (!S.alive) return true;
  const a = S.age, h = S.st.health;
  if (h <= 0 && a < 75 && (!S.flags.icu || a - S.flags.icu >= 4) && chance(.55)){
    S.flags.icu = a; S.st.health = R(8, 15);
    L('你病危住进了 ICU，医生下了病危通知书。抢救了三天三夜，你捡回了一条命。', 'b', {money:a >= 18 ? -R(30000, 100000) : 0, stress:15, happy:-8});
    if (a < 18 && tier() <= 1) S.flags.famDebt = (S.flags.famDebt || 0) + 50000;
    node('危', '从鬼门关走了一遭', '醒来的时候，家人守在床边，眼睛都哭肿了。', true);
    return false;
  }
  if (h <= 0){
    const w = S.ills.slice().sort((x, y) => ILL[y.id].fatal - ILL[x.id].fatal)[0];
    die(w && ILL[w.id].fatal ? `因${ILL[w.id].n}去世` : a >= 75 ? '油尽灯枯，寿终正寝' : S.flags.homeless ? '在一个寒冷的冬夜冻死街头' : a < 18 ? '体弱多病，不幸夭折' : '积劳成疾，病逝', 'ill');
    return true;
  }
  if (S.job && S.st.stress >= 90 && a < 60 && chance(.04)){ die('长期过度劳累，猝死在工位上', 'overwork'); return true; }
  let p = .0004;
  if (a >= 55) p += Math.pow((a - 55) / 45, 3) * .45;
  p += (100 - h) / 100 * (a >= 50 ? .008 + (a - 50) * .0012 : .002);
  if (chance(p)){ die(a >= 85 ? '在睡梦中安详离世' : h < 35 ? '病情恶化，不幸离世' : '突发疾病离世', 'natural'); return true; }
  return false;
}
function die(cause, type = ''){
  if (!S.alive) return;
  S.alive = false; S.cause = cause; S.dtype = type;
  queue = []; modalOpen = false; $('#modal').hidden = true;
  if (S.age >= 100) unlock('old');
  checkAch();
  L(`${S.name}在 ${S.age} 岁时${cause}。`, 'e');
  S.done = 1;
  const st = S.st;
  S.score = Math.max(0, Math.round(S.age + (st.health + st.smarts + st.looks + st.happy) / 4 - st.stress / 8 + Math.log10(Math.max(worth(), 1)) * 10 + S.edu * 6 + S.kids.length * 8 + S.grand * 4 + S.ach.length * 12 + (S.partner && S.partner.married ? 15 : 0) + Math.log10(Math.max(S.flags.charity || 0, 1)) * 5 - (S.flags.jailed ? 30 : 0) - (S.flags.homeless ? 30 : 0)));
  const end = ENDINGS.find(e => e.t(S));
  S.end = end.id;
  const seen = loadEndings();
  S.newEnd = !seen.includes(end.id);
  if (S.newEnd){ seen.push(end.id); saveEndings(seen); }
  S.showFinale = true;
}
function assetValue(){ return S.assets.houses.reduce((s, h) => s + h.v - Math.max(0, h.debt), 0) + S.assets.cars.reduce((s, c) => s + c.v, 0) + (S.items || []).reduce((s, x) => s + (x.v || 0), 0); }
function worth(){ return S.money + assetValue() - debtTotal(); }
function checkAch(){
  const w = worth();
  if (w >= 1e6) unlock('millionaire');
  if (w >= 1e8) unlock('tycoon');
  if (S.st.smarts >= 100) unlock('genius');
  if (S.st.health >= 100) unlock('fit');
  if (S.assets.houses.length >= 5) unlock('landlord');
  if ((S.flags.spent || 0) >= 1e7) unlock('spender');
  if (new Set(S.photos.map(p => p.p)).size >= 10) unlock('traveler');
  if ((hasIll('leg') || hasIll('arm')) && ((S.job && S.job.lv >= 2) || w >= 1e6 || S.flags.author || S.flags.athlete)) unlock('disabled');
  if (S.job && S.job.lv >= 3) unlock('chief');
}

function randomEvent(){
  const m = S.jail ? 'jail' : S.flags.homeless ? 'homeless' : S.flags.monk ? 'monk' : 'normal';
  // 同一件普通的事，一辈子最多遇到 3 次；流浪、坐牢、出家时的日常和一些持续性的事不限
  const UNCAP = ['urge','drunkfall','loan','digger','affairfound','owed','caught','grand','novisit','kidsick','teenkid','fight','shady'];
  const capped = e => !e.x && !UNCAP.includes(e.id) && ((S.evN || {})[e.id] || 0) >= 3;
  const ok = EV.filter(e => S.age >= e.a[0] && S.age <= e.a[1] && ((e.x || 'normal') === m || e.any) && !(e.once && S.once[e.id]) && !capped(e) && (!e.c || e.c()));
  if (!ok.length) return;
  // 最近发生过的事，短期内不太会再来一次（隔得越久越可能再遇到）
  S.evAt = S.evAt || {}; S.evN = S.evN || {};
  const wt = x => { const l = S.evAt[x.id], g = l == null ? 99 : S.age - l; return (x.w || 1) * (g >= 8 ? 1 : Math.max(.05, g / 8)) / (1 + (S.evN[x.id] || 0) * .6); };
  let r = Math.random() * ok.reduce((s, x) => s + wt(x), 0), e = ok[ok.length - 1];
  for (const x of ok){ r -= wt(x); if (r <= 0){ e = x; break; } }
  S.evAt[e.id] = S.age; S.evN[e.id] = (S.evN[e.id] || 0) + 1;
  if (e.once) S.once[e.id] = 1;
  curNeed = e.c || null;
  try { e.r(); } finally { curNeed = null; }
}

/* 借出去的钱：可能还，可能还一部分，也可能再也要不回来 */
function loansTick(){
  for (const ln of [...S.loans]){
    ln.yrs++;
    const r = Math.random(), drop = () => S.loans.splice(S.loans.indexOf(ln), 1);
    if (r < .14){ drop(); unlock('repaid'); L(`${ln.who}把借你的 ${fmt(ln.amt)} 还上了。`, 'g', {money:ln.amt, happy:4}); }
    else if (r < .24){ const part = Math.round(ln.amt * R(20, 50) / 100); ln.amt -= part; L(`${ln.who}还了你 ${fmt(part)}，说剩下的过段时间再给。`, 'n', {money:part}); }
    else if (r < .30){ drop(); L(`${ln.who}把你拉黑了。借出去的 ${fmt(ln.amt)} 再也要不回来了。`, 'b', {happy:-8, stress:5}); }
    else if (ln.yrs >= 2 && !ln.asked && r < .45){ ln.asked = 1; collect(ln); }
  }
}
function collect(ln){
  const back = (txt, x) => { S.loans.splice(S.loans.indexOf(ln), 1); unlock('repaid'); L(txt, 'g', {money:x, happy:5}); };
  modal('要债', `${ln.who}借你的 ${fmt(ln.amt)} 已经 ${ln.yrs} 年了，一直拖着不还。`, [
    {l:'好言好语地催', f:() => chance(.3) ? back(`${ln.who}不好意思地把钱还了。`, ln.amt) : L('对方说最近手头紧，再缓缓。', 'n', {stress:3})},
    {l:'上门去堵人', f:() => chance(.4) ? back(`你在他家门口坐了一天，${ln.who}终于把钱还了，你们也彻底翻了脸。`, ln.amt) : L('你在他家门口等了一天，他从后门溜了。', 'b', {stress:6})},
    {l:'去法院起诉', d:'诉讼费 2 万', f:() => { S.money -= 20000; if (chance(ln.iou ? .85 : .35)){ if (chance(.45)) back('官司赢了，法院强制执行，钱拿回来了。', ln.amt); else { const g = Math.round(ln.amt * .15); S.loans.splice(S.loans.indexOf(ln), 1); L(`官司赢了，可对方名下没有财产，成了“老赖”。你只拿回了 ${fmt(g)}。`, 'b', {money:g, stress:6}); } } else { S.loans.splice(S.loans.indexOf(ln), 1); L('没有欠条，证据不足，官司输了。', 'b', {happy:-8}); } }},
    {l:'算了', f:() => { S.loans.splice(S.loans.indexOf(ln), 1); L('你删掉了他的联系方式，就当买了个教训。', 'n', {happy:-3, stress:-3}); }},
  ], '人情');
}

/* ---------- 行动：每个人生阶段能做的事不一样；努力不一定有回报 ---------- */
function tryAct(k, lo, hi, good, lazy, fx = {}){
  const d = grow(k, lo, hi);
  if (d) L(pick(good), 'g', {...fx, [k]:d});
  else L(pick(lazy), 'n', fx);
  return d;
}

function jobHunt(change){
  const f = S.flags, a = S.age;
  const disabled = hasIll('leg') || hasIll('arm');
  const bonus = (f.elite || f.abroad ? .1 : 0) + (f.intern ? .05 : 0) + Math.min(.15, (f.certs || 0) * .05) - (a >= 45 ? .25 : a >= 35 ? .1 : 0) - (f.jailed ? .2 : 0) - (f.homeless ? .3 : 0);
  const list = JOBS.filter(j => !(change && S.job && j.t === S.job.t)).map(j => {
    const okEdu = S.edu >= j.edu || (j.t === '工厂工人' && f.vocational === 2);
    const okSm = S.st.smarts >= (j.sm || 0), okLk = !j.lk || S.st.looks >= j.lk, okHp = !j.hp || S.st.health >= j.hp;
    const okBody = !(disabled && ((j.risk || 1) >= 1.5 || j.hp || j.lk));
    const okRec = !(f.jailed && ['公务员','警察','教师','飞行员'].includes(j.t));
    const okHome = !f.homeless || j.edu === 0;
    const ok = okEdu && okSm && okLk && okHp && okBody && okRec && okHome;
    const req = [j.edu ? EDU[j.edu] : '', j.sm ? `智力${j.sm}` : '', j.lk ? `颜值${j.lk}` : '', j.hp ? `健康${j.hp}` : ''].filter(Boolean).join(' ') || '无要求';
    const why = !okBody ? '身体条件不符' : !okRec ? '有犯罪记录' : !okHome ? '没有住址' : req;
    return {l:j.t, d:`${fmt(j.pay)}/年 · ${why}`, ok, dis:() => !ok || S.ap <= 0, f:() => {
      spend();
      const p = clamp((j.hard || .7) + (S.st.smarts - (j.sm || 0)) / 150 + bonus, .05, .92);
      if (chance(p)){
        const pay = Math.round(j.pay * (.85 + Math.random() * .3));
        L(change && S.job ? `你从${jobName()}跳槽，成了一名${j.t}。` : `你应聘成功，成了一名${j.t}。`, 'e', {happy:6});
        setJob(j.t, pay);
        if (j.t === '演员') node('演', '成了演员', '第一次站在镜头前，你的手一直在抖。');
      } else L(`你去面试了${j.t}，${pick(['没有通过','对方说回去等通知，然后就没了消息','面试官嫌你没经验'])}。`, 'b', {happy:-3, stress:3});
    }};
  }).sort((x, y) => y.ok - x.ok);
  list.push({l:'算了', d:'不消耗行动', f:() => {}});
  modal(change ? '换工作' : '找工作', `投一份简历要花掉一次行动。${a >= 45 ? '你这个年纪，很多公司已经不太愿意要了。' : ''}灰色的岗位你暂时够不着。`, list, '求职');
}

function treatMenu(){
  if (!S.ills.length){
    spend();
    if (chance(.1)){
      const id = pick(S.age >= 40 ? ['bp','sugar','stomach','cancer'] : ['stomach','asthma']);
      S.ills.push({id, yrs:0, tries:0, tx:S.age});
      L(`体检查出了早期的${ILL[id].n}，还好发现得早。`, 'b', {money:-2000, stress:5});
    } else tryAct('health', 1, 3, ['你做了一次全面体检，医生说你身体不错。'], ['体检没查出什么问题，医生让你少熬夜。'], {money:-2000});
    return;
  }
  const cs = [];
  const cost = c => S.age < 18 ? `${fmt(c)} · 家里出` : fmt(c) + (S.money < c ? ' · 要借钱' : '');
  S.ills.forEach(il => {
    const d = ILL[il.id];
    if (d.nocure) return;
    const m = Math.pow(1.5, il.tries), c1 = Math.round(d.cost * .2 * m), c2 = Math.round(d.cost * m), c3 = Math.round(d.cost * 3 * m);
    const nm = d.n + (il.tries ? `（第 ${il.tries + 1} 次）` : '');
    cs.push({l:`${nm} · 吃药`, d:cost(c1), f:() => treat(il, c1, d.cure * .35, '吃药调理')});
    cs.push({l:`${nm} · 住院治疗`, d:cost(c2), f:() => treat(il, c2, d.cure, '住院治疗')});
    cs.push({l:`${nm} · 找顶级专家`, d:cost(c3), f:() => treat(il, c3, Math.min(.92, d.cure * 1.6), '去大城市找专家')});
  });
  cs.push({l:'试试偏方', d:'几百块', f:() => { spend(); const il = pick(S.ills); if (chance(.04) && !ILL[il.id].nocure) cureIll(il); else if (chance(.3)) L('喝了三个月偏方，病情反而加重了。', 'b', {health:-5, money:adultMoney(500)}); else L('偏方没什么用。', 'n', {money:adultMoney(500)}); }});
  cs.push({l:'算了', d:'不消耗行动', f:() => {}});
  modal('看医生', `治病不一定能治好；每次没治好，下一次都会更贵。${S.age < 18 && tier() <= 1 ? '家里条件不好，治病的钱要去借。' : ''}`, cs, '身体');
}
function treat(il, cost, p, how){
  spend();
  il.tries++; il.tx = S.age;
  const m = payFor(cost);
  if (chance(p)){ L(`你花了 ${fmt(cost)} ${how}。`, 'n', {money:m}); cureIll(il); }
  else L(`你花了 ${fmt(cost)} ${how}，${pick(['病情暂时稳住了，但没有根治','医生说还要继续治','效果不明显，下次得换更贵的方案'])}。`, 'b', {money:m, stress:5, health:R(1, 4)});
}

function travelMenu(free){
  const cs = DEST.map((d, i) => ({l:d.n, d:`${free ? '徒步云游' : fmt(d.cost)}${d.risk >= 2 ? ' · 很危险' : d.risk ? ' · 有风险' : ''}`,
    dis:() => (!free && S.money < d.cost) || S.ap <= 0 || (d.everest && S.st.health < 70), f:() => trip(i, free)}));
  cs.push({l:'算了', d:'不消耗行动', f:() => {}});
  modal(free ? '云游' : '去旅行', S.age >= 70 ? '年纪大了，出远门要格外小心。' : '越远越贵，有些地方很危险。每次旅行都会拍一张照片。', cs, '旅行');
}
function trip(i, free){
  spend();
  cue('plane');
  const d = DEST[i], seed = R(1, 1e9);
  if (!free){ S.money -= d.cost; S.flags.spent = (S.flags.spent || 0) + d.cost; }
  S.flags.trips = (S.flags.trips || 0) + 1;
  if (d.adv) S.flags.adv = (S.flags.adv || 0) + 1;
  if (chance((d.risk || 0) * .06 + (S.age >= 70 ? .08 : 0) + .03)){
    const x = d.everest ? {id:'everest', trip:1, t:'你在海拔八千米遇上了暴风雪', lethal:.35, maim:.2, hurt:.4, hurtT:'严重冻伤，被向导背了下来', die:'在攀登珠峰时遇难'}
      : d.risk >= 2 ? {id:'wild', trip:1, t:pick(['你在野外迷了路，三天没找到水','一条毒蛇咬了你的脚踝','你乘坐的小飞机迫降了']), lethal:.12, maim:.08, hurt:.5, die:`在${d.n}遇险身亡`}
      : {id:'tour', trip:1, t:pick(['旅游大巴在山路上翻了车','你在景区的栈道上摔了一跤','你在海边被大浪卷走','你在异国街头遇到了持刀抢劫']), lethal:.05, maim:.04, hurt:.5, die:`在${d.n}旅行时遭遇意外`};
    const r = accident(x);
    if (r === 'dead') return;
    if (r !== 'ok'){ L(`这趟${d.n}之行，以医院告终。`, 'b', {happy:-5}); return; }
  }
  const mis = Math.random(), fx = {happy:R(4, 9), stress:-R(8, 15)};
  let extra = '';
  const tn = (S.yr = S.yr || {}).trip = (S.yr.trip || 0) + 1, again = S.photos.some(p => p.p === i);
  if (mis < .1){ extra = pick(['你的钱包在当地被偷了。','你被导游拉去购物店宰了一刀。']); fx.money = -R(2000, 20000); fx.happy = 1; }
  else if (mis < .17){ extra = '你水土不服，拉了好几天肚子。'; fx.health = -3; fx.happy = 2; }
  else if (mis < .22 && !S.partner && S.age < 60){ const n = randName(other()); setPartner(n); extra = `你在路上认识了${n}，回来后你们在一起了。`; fx.happy = 12; }
  if (tn === 2){ fx.happy = Math.ceil(fx.happy / 2); extra += ' 一年出门两趟，兴致没那么高了。'; }
  else if (tn >= 3){ fx.happy = -R(1, 4); fx.health = (fx.health || 0) - 2; extra += ' 一年里跑了太多地方，你累得只想回家。'; }
  else if (again){ fx.happy = Math.ceil(fx.happy * .6); extra += ' 第二次来，没有第一次那么惊艳了。'; }
  S.photos.push({p:i, a:S.age, s:seed});
  L(`你去了${d.n}。${extra}`, mis < .17 ? 'n' : 'g', fx);
  if (d.everest){ unlock('everest'); node('峰', '登顶珠穆朗玛峰', '你在峰顶待了十分钟，那是世界的屋脊。'); }
  if (d.n === '南极') unlock('antarctica');
  modal(d.n, d.cap + (extra ? ' ' + extra : ''), [{l:'收好照片'}], `第 ${S.flags.trips} 次远行 · ${S.age} 岁`, photoHTML(i, seed, S.age));
}

/* ---------- 旅行照片：按目的地和随机种子画一张拍立得 ---------- */
function rng(seed){
  let a = seed >>> 0;
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let photoN = 0;
const sky = (u, a, b) => `<defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="240" height="160" fill="url(#${u})"/>`;
function ridge(r, base, amp, n){
  let p = `0,160 0,${base - r() * amp * .4}`;
  for (let i = 1; i <= n; i++){ const x = i * 240 / n; p += ` ${(x - 120 / n).toFixed(1)},${(base - amp * (.5 + r() * .5)).toFixed(1)} ${x.toFixed(1)},${(base - r() * amp * .35).toFixed(1)}`; }
  return `<polygon points="${p} 240,160"/>`;
}
function peak(x, y, w, fill, snow){
  const b = 132, sy = y + (b - y) * .3, sw = w * .3;
  return `<polygon fill="${fill}" points="${x - w},${b} ${x},${y} ${x + w},${b}"/>` + (snow ? `<polygon fill="#F7FBFF" points="${x},${y} ${x - sw},${sy} ${x - sw * .4},${sy - 4} ${x},${sy + 2} ${x + sw * .5},${sy - 5} ${x + sw},${sy}"/>` : '');
}
const stars = (r, n, h = 90) => Array.from({length:n}, () => `<circle cx="${(r() * 240).toFixed(1)}" cy="${(r() * h).toFixed(1)}" r="${(r() * .9 + .3).toFixed(2)}" fill="#fff" opacity="${(r() * .6 + .4).toFixed(2)}"/>`).join('');

    return sky(u, P[0], P[1]) + `<circle cx="${50 + r() * 140}" cy="${30 + r() * 20}" r="10" fill="#fff" opacity=".7"/>`

      + `<path d="M150 128 h22 l-4 5 h-14z" fill="#5A3E2B"/><line x1="160" y1="128" x2="160" y2="116" stroke="#5A3E2B" stroke-width="1"/>`;
  },
  sea(r, d, u){
    const P = [['#58B8E8','#CFEFFB','#1E88B8','#F2DDA8'],['#36C2D6','#D8F7F2','#10A3B5','#F7E9C6']][d.pal];
    const sx = 40 + r() * 160;

  desert(r, d, u){

    return sky(u, P[0], P[1]) + (night ? stars(r, 60, 100) + '<circle cx="190" cy="34" r="9" fill="#F4F0D8"/>' : `<circle cx="${60 + r() * 120}" cy="${36 + r() * 15}" r="${16 + r() * 6}" fill="#FFF0C0" opacity=".9"/>`)
      + (d.pyr ? `<polygon points="70,120 108,62 146,120" fill="#D9AE6A"/><polygon points="108,62 146,120 118,120" fill="#B88A4A"/><polygon points="140,122 162,90 184,122" fill="#D9AE6A"/><polygon points="162,90 184,122 168,122" fill="#B88A4A"/>` : '')
      + `<path d="M0 118 Q70 96 140 116 T240 108 V160 H0z" fill="${P[2]}"/><path d="M0 140 Q90 118 170 138 T240 132 V160 H0z" fill="${P[3]}"/>`
      + (d.pal === 1 ? '<path d="M120 160 L118 118" stroke="#6B5A48" stroke-width="10" opacity=".5"/>' : '');

  city(r, d, u){
    const P = d.pal ? ['#24345E','#E98A6A'] : ['#F49A7A','#FBD9B8'];
    let b = '';

    }
    const tower = d.tower ? `<g fill="#3E3346"><polygon points="120,14 124,14 131,80 113,80"/><polygon points="113,78 131,78 146,134 136,134 122,104 108,134 98,134"/><rect x="110" y="76" width="24" height="4"/><rect x="104" y="100" width="36" height="4"/></g>` : '';
    return sky(u, P[0], P[1]) + `<circle cx="${50 + r() * 140}" cy="${50 + r() * 20}" r="12" fill="#FFE2B0" opacity=".85"/>` + tower + b + `<rect y="134" width="240" height="26" fill="${d.pal ? '#121828' : '#6F8FA8'}"/>`;
  },
  savanna(r, d, u){
    return sky(u, '#F08A3C', '#FBD38A') + `<circle cx="${70 + r() * 100}" cy="96" r="30" fill="#FFE9A8" opacity=".9"/>`
      + `<rect y="112" width="240" height="48" fill="#C9A24C"/><rect y="112" width="240" height="4" fill="#A9853A"/>`
      + `<line x1="60" y1="132" x2="62" y2="98" stroke="#2B1D12" stroke-width="3"/><ellipse cx="62" cy="96" rx="30" ry="7" fill="#2B1D12"/>`
      + `<g fill="#2B1D12"><rect x="170" y="100" width="3" height="22"/><rect x="180" y="100" width="3" height="22"/><ellipse cx="177" cy="100" rx="11" ry="6"/><path d="M184 98 L194 70 L198 71 L190 100z"/><ellipse cx="197" cy="69" rx="5" ry="2.5"/></g>`
      + Array.from({length:4}, () => { const x = 120 + r() * 100, y = 30 + r() * 30; return `<path d="M${x} ${y} l4 3 l4 -3" stroke="#3A2A1A" stroke-width="1.2" fill="none"/>`; }).join('');
  },
  temple(r, d, u){
    const P = d.pal ? ['#F6C9D2','#FCEFF0'] : ['#F2B27A','#FBE5C8'];
    let pg = '';
    for (let k = 0; k < 4; k++){
      const y = 118 - k * 20, w = 34 - k * 6;
      pg += `<rect x="${120 - w * .55}" y="${y}" width="${w * 1.1}" height="12" fill="#3B2A2E"/><path d="M${120 - w - 6} ${y + 2} Q120 ${y - 10} ${120 + w + 6} ${y + 2} L${120 + w} ${y + 5} H${120 - w}z" fill="#2A1E22"/>`;
    }
    pg += `<rect x="118.5" y="30" width="3" height="12" fill="#2A1E22"/>`;
    const blossom = d.pal ? Array.from({length:70}, () => { const left = r() < .5, x = left ? r() * 60 : 180 + r() * 60, y = r() * 60; return `<circle cx="${x}" cy="${y}" r="${2 + r() * 3}" fill="${r() < .5 ? '#F7A8BC' : '#FBD0DB'}"/>`; }).join('') : '';
    const wall = d.pal ? '' : `<rect y="128" width="240" height="32" fill="#7A5A44"/>` + Array.from({length:16}, (_, i) => `<rect x="${i * 15}" y="122" width="9" height="7" fill="#7A5A44"/>`).join('');
    return sky(u, P[0], P[1]) + `<circle cx="190" cy="40" r="14" fill="#fff" opacity=".6"/>` + pg + `<rect y="130" width="240" height="30" fill="${d.pal ? '#B9A6A0' : '#8A6A50'}"/>` + wall + blossom;
  },
  mount(r, d, u){
    const P = [['#79B4E8','#E4F0FA','#7F95AB','#5E7A92','#5E9A55'],null,['#F4B9A8','#FDE9DC','#8A86A6','#6B6688','#7A9A6A'],['#1F4E8C','#9CC4EE','#6A7E98','#4E6280','#E8EEF4']][d.pal];
    let m = `<g fill="${P[2]}" opacity=".6">${ridge(r, 100, 30, 6)}</g>`;
    if (d.fuji) m += `<polygon points="20,134 120,46 220,134" fill="${P[3]}"/><polygon points="101,63 120,46 139,63 132,68 126,61 119,69 112,61 106,68" fill="#F7FBFF"/>`;
    else if (d.everest) m += peak(70, 60, 60, P[2], 1) + peak(130, 26, 70, P[3], 1) + peak(200, 70, 50, P[2], 1);
    else m += peak(60, 52, 55, P[3], 1) + peak(150, 40, 65, P[3], 1) + peak(215, 66, 45, P[2], 1);
    const fg = d.everest
      ? `<rect y="132" width="240" height="28" fill="${P[4]}"/><path d="M20 140 Q120 120 220 142" stroke="#555" stroke-width=".6" fill="none"/>` + ['#2E6FD8','#FFFFFF','#D8342E','#2EA35A','#F2C230'].map((c, i) => [0, 1, 2, 3].map(j => `<rect x="${30 + (i + j * 5) * 9}" y="${134 - Math.sin((i + j * 5) / 19 * Math.PI) * 14}" width="6" height="7" fill="${c}"/>`).join('')).join('') + '<circle cx="128" cy="30" r="1.6" fill="#D8342E"/>'
      : `<rect y="130" width="240" height="30" fill="${P[4]}"/>` + (d.fuji ? '' : `<rect x="170" y="122" width="18" height="12" fill="#8A4A32"/><polygon points="166,123 179,113 192,123" fill="#5A2E22"/>`);
    return sky(u, P[0], P[1]) + (d.pal === 2 ? '<circle cx="190" cy="44" r="12" fill="#FFE0C8"/>' : '') + m + fg;
  },
  plateau(r, d, u){
    return sky(u, '#1E5FB8', '#8FC4F0') + Array.from({length:4}, () => `<ellipse cx="${r() * 240}" cy="${20 + r() * 40}" rx="${16 + r() * 18}" ry="${5 + r() * 4}" fill="#fff" opacity=".9"/>`).join('')
      + peak(70, 58, 70, '#9AA8B8', 1) + peak(170, 50, 75, '#8796A8', 1) + `<rect y="126" width="240" height="34" fill="#8A9A4E"/>`
      + `<path d="M0 104 Q120 140 240 98" stroke="#6A5A4A" stroke-width=".7" fill="none"/>` + Array.from({length:24}, (_, i) => { const x = i * 10 + 2, y = 104 + Math.sin(i / 23 * Math.PI) * 18 - (i / 23) * 6; return `<rect x="${x}" y="${y}" width="7" height="9" fill="${['#2E6FD8','#FFFFFF','#D8342E','#2EA35A','#F2C230'][i % 5]}"/>`; }).join('');
  },
  jungle(r, d, u){
    return sky(u, '#B9D8B0', '#E8F2DC') + `<g fill="#6E9A6A" opacity=".7">${ridge(r, 80, 25, 6)}</g><g fill="#3E7A48">${ridge(r, 104, 25, 8)}</g>`
      + `<path d="M90 160 Q120 130 110 112 Q140 120 150 160z" fill="#7DB3C6"/>`
      + Array.from({length:22}, () => { const x = r() * 240, y = 110 + r() * 50; return `<circle cx="${x}" cy="${y}" r="${8 + r() * 12}" fill="${r() < .5 ? '#1F5A30' : '#2E7040'}"/>`; }).join('') + '<circle cx="186" cy="96" r="2.5" fill="#E8402E"/>';
  },
  ice(r, d, u){
    return sky(u, '#B8D8EE', '#F2F8FC') + `<rect y="104" width="240" height="56" fill="#2A5F8A"/>`
      + Array.from({length:3}, (_, i) => { const x = 20 + i * 75 + r() * 20, h = 20 + r() * 30; return `<polygon points="${x},106 ${x + 12},${106 - h} ${x + 30},${106 - h * .7} ${x + 48},106" fill="#F4FAFF"/><polygon points="${x + 30},${106 - h * .7} ${x + 48},106 ${x + 34},106" fill="#CFE4F2"/>`; }).join('')
      + `<path d="M0 132 Q120 122 240 134 V160 H0z" fill="#F4FAFF"/>` + Array.from({length:5}, (_, i) => { const x = 40 + i * 14 + r() * 6; return `<ellipse cx="${x}" cy="138" rx="4" ry="7" fill="#1A1A22"/><ellipse cx="${x + 1}" cy="139" rx="2.4" ry="5" fill="#fff"/><circle cx="${x}" cy="130" r="2.8" fill="#1A1A22"/>`; }).join('');
  },
};
function photoHTMLsvg(i, seed, age){
  const d = DEST[i], u = 'ph' + (++photoN);
  const svg = SCN[d.scene](rng(seed), d, u);
  return `<figure class="photo"><svg viewBox="0 0 240 160" role="img" aria-label="${esc(d.n)}的照片">${svg}</svg><figcaption>${esc(d.n)} · ${age}岁</figcaption></figure>`;
}


/* ---------- 事件动画：发生什么，屏幕上就演 5 秒什么 ---------- */
const fxLayer = (() => {
  const cv = $('#fxc'), g = cv.getContext('2d');
  let W = 1, H = 1, list = [], wait = [], running = false, dark = false;
  const readDark = () => { dark = getComputedStyle(document.documentElement).getPropertyValue('--sky-dark').trim() === '1'; };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const env = p => Math.max(0, Math.min(1, p / .08, (1 - p) / .22));
  const many = (n, f) => Array.from({length:n}, f);
  function resize(){
    const dpr = Math.min(1.5, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function shakeApp(cls){ const a = $('#game'); a.classList.remove('shake', 'jolt'); void a.offsetWidth; a.classList.add(cls); setTimeout(() => a.classList.remove(cls), 1800); }
  const tint = (c, a) => { g.globalAlpha = a; g.fillStyle = c; g.fillRect(0, 0, W, H); g.globalAlpha = 1; };
  const FX = {
    fireworks:{init:() => ({b:many(9, (_, i) => ({t:i * .45 + rnd(0, .3), x:rnd(.12, .88) * W, y:rnd(.1, .42) * H, c:pick(['#FFC233','#EF476F','#06C48F','#2FB4E8','#FF7A1A','#B05CF0','#FF5EA8']), ps:many(54, (_, k) => ({a:k / 54 * 6.283 + rnd(0, .12), v:rnd(60, 185)}))}))}),
      draw(s, p, e, t){
        s.b.forEach(b => {
          const lt = t - b.t; if (lt < 0) return;
          g.fillStyle = b.c; g.strokeStyle = b.c;
          if (lt < .6){ const k = lt / .6, y = H - (H - b.y) * (1 - (1 - k) * (1 - k)); g.globalAlpha = e; g.fillRect(b.x - 2, y, 4, 18); return; }
          const et = lt - .6; if (et > 1.8) return;
          const al = Math.max(0, 1 - et / 1.8) * e;
          if (et < .18){ g.globalAlpha = (1 - et / .18) * .45 * e; g.beginPath(); g.arc(b.x, b.y, 46, 0, 6.3); g.fill(); }
          g.lineWidth = 2.4; g.lineCap = 'round';
          b.ps.forEach(q => {
            const d = q.v * et * (1 - et * .2), d2 = q.v * Math.max(0, et - .12) * (1 - et * .2), dy = 38 * et * et;
            const x = b.x + Math.cos(q.a) * d, y = b.y + Math.sin(q.a) * d + dy;
            g.globalAlpha = al * .5; g.beginPath(); g.moveTo(b.x + Math.cos(q.a) * d2, b.y + Math.sin(q.a) * d2 + dy * .8); g.lineTo(x, y); g.stroke();
            g.globalAlpha = al; g.beginPath(); g.arc(x, y, 2.6, 0, 6.3); g.fill();
          });
        });
      }},
    lanterns:{init:() => ({l:many(15, () => ({x:rnd(.04, .96), d:rnd(0, 2), v:rnd(.13, .22), s:rnd(.75, 1.25), ph:rnd(0, 6)}))}),
      draw(s, p, e, t){
        s.l.forEach(l => {
          const lt = t - l.d; if (lt < 0) return;
          const y = H + 40 - lt * l.v * H, x = l.x * W + Math.sin(lt * 1.4 + l.ph) * 16, w = 18 * l.s, h = 24 * l.s;
          const gl = g.createRadialGradient(x, y, 0, x, y, w * 2.6);
          gl.addColorStop(0, `rgba(255,170,80,${.5 * e})`); gl.addColorStop(1, 'rgba(255,120,60,0)');
          g.fillStyle = gl; g.fillRect(x - w * 2.6, y - w * 2.6, w * 5.2, w * 5.2);
          g.globalAlpha = e;
          g.fillStyle = '#D9302B'; g.beginPath(); g.ellipse(x, y, w / 2, h / 2, 0, 0, 6.3); g.fill();
          g.fillStyle = '#F5C542'; g.fillRect(x - w * .3, y - h / 2 - 2, w * .6, 3); g.fillRect(x - w * .3, y + h / 2 - 1, w * .6, 3);
          g.fillRect(x - .7, y + h / 2 + 2, 1.4, 8 * l.s);
          g.globalAlpha = 1;
        });
      }},
    petals:{init:() => ({q:many(60, () => ({x:rnd(0, 1), d:rnd(-1.2, 2.2), v:rnd(.12, .22), r:rnd(6, 10), ph:rnd(0, 6), c:pick(['#F06292','#F48FB1','#EC407A','#FF8FB1','#E85D8A'])}))}),
      draw(s, p, e, t){
        s.q.forEach(q => {
          const lt = t - q.d; if (lt < 0) return;
          g.save(); g.globalAlpha = e * .92;
          g.translate(q.x * W + Math.sin(lt * 1.3 + q.ph) * 34, -12 + lt * q.v * H); g.rotate(lt * 2 + q.ph); g.scale(1, Math.abs(Math.cos(lt * 2.4 + q.ph)) * .6 + .4);
          g.fillStyle = q.c; g.beginPath(); g.moveTo(0, -q.r); g.quadraticCurveTo(q.r * .9, -q.r * .2, 0, q.r * .7); g.quadraticCurveTo(-q.r * .9, -q.r * .2, 0, -q.r); g.fill();
          g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(0, -q.r * .25, q.r * .18, q.r * .4, 0, 0, 6.3); g.fill(); g.restore();
        });
      }},
    coins:{init:() => ({c:many(46, () => ({x:rnd(.03, .97), d:rnd(0, 2.6), r:rnd(7, 12), ph:rnd(0, 6), v:rnd(.8, 1.2)}))}),
      draw(s, p, e, t){
        s.c.forEach(c => {
          const lt = t - c.d; if (lt < 0) return;
          const y = -20 + (lt * 70 + lt * lt * 230) * c.v; if (y > H + 20) return;
          const sx = Math.cos(lt * 7 + c.ph);
          g.save(); g.globalAlpha = e; g.translate(c.x * W, y); g.scale(Math.max(.15, Math.abs(sx)), 1);
          const gr = g.createRadialGradient(-c.r * .3, -c.r * .3, 1, 0, 0, c.r);
          gr.addColorStop(0, '#FFF3B8'); gr.addColorStop(1, '#D9A23A');
          g.fillStyle = gr; g.beginPath(); g.arc(0, 0, c.r, 0, 6.3); g.fill();
          g.strokeStyle = '#A8761C'; g.lineWidth = 1.6; g.beginPath(); g.arc(0, 0, c.r * .66, 0, 6.3); g.stroke();
          g.restore();

const skyBg = (() => {
  const cv = $('#sky'), g = cv.getContext('2d');
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  const css = (c, al = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`;
  let W = 1, H = 1, cur = null, tgt = null, sun = null, sunT = {x:.12, y:.6}, scene = 'dawn', dark = false, running = false, last = 0, darkCheck = 0;
  const motes = Array.from({length:24}, () => ({x:Math.random(), y:Math.random(), r:.8 + Math.random() * 1.8, s:.006 + Math.random() * .012, ph:Math.random() * 6.3}));
  const stars = Array.from({length:110}, () => ({x:Math.random(), y:Math.random() * .62, r:Math.random() * 1.1 + .3, ph:Math.random() * 6.3}));
  const clouds = Array.from({length:5}, () => ({x:Math.random(), y:.06 + Math.random() * .3, w:.16 + Math.random() * .22, v:.003 + Math.random() * .005}));
  const drops = Array.from({length:70}, () => ({x:Math.random(), y:Math.random(), v:.5 + Math.random() * .5}));
  const ridges = [0, 1, 2].map(() => Array.from({length:3}, (_, i) => [Math.random() * 6.3, (1 + Math.random() * 2) * (i + 1)]));
  const ridgeY = (L, x) => {
    const base = [.64, .73, .84][L], amp = [.1, .075, .05][L];
    return base - amp * (ridges[L].reduce((s, [ph, f], i) => s + Math.sin(x * Math.PI * 2 * f + ph) * [.55, .3, .15][i], 0) * .5 + .5);
  };
  function resize(){
    const dpr = Math.min(1.5, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (cur) draw(performance.now());
  }
  function readDark(){ return getComputedStyle(document.documentElement).getPropertyValue('--sky-dark').trim() === '1'; }
  function set(sc, p){
    scene = sc; dark = readDark();
    tgt = SKY[dark ? 'dark' : 'light'][sc].map(hex);
    sunT = {x:.1 + .8 * p, y:.6 - .4 * Math.sin(Math.PI * p)};
    if (!cur || reduced){ cur = tgt.map(c => c.slice()); sun = {...sunT}; }
    if (reduced) draw(0);
    else if (!running){ running = true; requestAnimationFrame(loop); }
  }
  function loop(now){
    if (document.hidden){ running = false; return; }
    if (now - last > 33){
      const k = Math.min(1, (now - last) / 900);

    if (night || dark) stars.forEach(s => { g.fillStyle = `rgba(255,255,255,${(night ? .55 : .3) + Math.sin(t * 1.7 + s.ph) * .25})`; g.beginPath(); g.arc(s.x * W, s.y * H, s.r, 0, 6.3); g.fill(); });
    const sx = sun.x * W, sy = sun.y * H, R = Math.max(26, Math.min(W, H) * .06);

    glow.addColorStop(0, css(c[5], night ? .35 : .75)); glow.addColorStop(1, css(c[5], 0));
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    g.fillStyle = css(c[5], .95); g.beginPath(); g.arc(sx, sy, R * .62, 0, 6.3); g.fill();
    if (night){ g.fillStyle = css(c[0], .9); g.beginPath(); g.arc(sx + R * .25, sy - R * .12, R * .55, 0, 6.3); g.fill(); }
    if (!night) clouds.forEach(cl => {
      const x = ((cl.x + t * cl.v * .05) % 1.4 - .2) * W, y = cl.y * H, w = cl.w * W;
      const cg = g.createRadialGradient(x, y, 0, x, y, w);
      cg.addColorStop(0, `rgba(255,255,255,${dark ? .07 : .4})`); cg.addColorStop(1, 'rgba(255,255,255,0)');

      g.fillStyle = css(col, [.6, .82, 1][L]);
